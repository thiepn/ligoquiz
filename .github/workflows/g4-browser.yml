name: G4 Browser Qualification
on:
  pull_request:
    branches: ['rebuild/v2', 'feature/g5-shared-experience', 'feature/g6-quiztafel', 'feature/g7-verbindungen', 'feature/g8-logikleiter', 'feature/g9-umfrageduell', 'feature/g10-content-studio', 'feature/g11-production-resilience', 'feature/g12-event-rehearsal', 'feature/g13-organizer-workflows', 'feature/g14-host-moderation', 'feature/g15-readable-stage-accessibility', 'feature/g16-moderation-evidence-review', 'feature/g17-correction-provenance-recovery', 'feature/g18-event-trial-release-matrix']
  push:
    branches: ['rebuild/v2', 'feature/g8-logikleiter', 'feature/g9-umfrageduell', 'feature/g10-content-studio', 'feature/g11-production-resilience', 'feature/g12-event-rehearsal', 'feature/g15-readable-stage-accessibility']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    name: Host and projector (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Use consistent npm resolver
        run: npm install --global npm@11
      - name: Install locked application
        run: npm ci --no-audit --no-fund
      - name: Install pinned browser-test runner without modifying project lockfile
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Exercise G14 moderation and keyboard smoke first
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g14-host-guide.spec.mjs
      - name: Rehearse G12 Quiztafel three-team restart before full suite
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g12-rehearsal.spec.mjs --grep "Quiztafel, 3 teams"
      - name: Exercise G15 projected-stage and 200-percent host geometry
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g15-visual-accessibility.spec.mjs
      - name: Preserve G15 screenshots for independent visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g15-visual-evidence
          path: test-results/g15-evidence/
          if-no-files-found: error
      - name: Rehearse Verbindungen three-team crash and safe pause
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g12-rehearsal.spec.mjs --grep "Verbindungen, 3 teams"
      - name: Rehearse G9 Umfrageduell reload and preserved adjudications
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g9-umfrageduell.spec.mjs --grep "reload pauses projector"
      - name: Exercise G16 score decision and evidence review flows first
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g16-decision-review.spec.mjs
      - name: Exercise G17 revision, source audit, and evidence reconciliation flows
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g17-correction-provenance.spec.mjs
      - name: Exercise G18 operator trials and independent release-gate denial
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g18-event-trial.spec.mjs
      - name: Retain non-golden G18 trial screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g18-event-trial-visuals
          path: test-results/g18-evidence/
          if-no-files-found: error
      - name: Exercise G19 external detached witnesses and fail-closed recovery
        run: npx playwright test --config e2e/playwright.config.mjs e2e/g19-witness-review.spec.mjs
      - name: Retain G19 unsigned synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g19-witness-visuals
          path: test-results/g19-evidence/
          if-no-files-found: error
      - name: Exercise full game and projector browser flows
        run: npx playwright test --config e2e/playwright.config.mjs
      - name: Build scoped offline PWA
        run: npm run build
      - name: Test offline installed build and safe navigation
        run: npx playwright test --config e2e/playwright.offline.config.mjs
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: g4-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
