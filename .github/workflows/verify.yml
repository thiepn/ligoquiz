name: Verify v2 foundation
on:
  push:
    branches: ['rebuild/v2']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # one-time lockfile bootstrap only on isolated rebuild branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Verify strict types, lint and tests
        run: npm run verify
      - name: Build static production bundle
        run: npm run build
      - name: Commit npm lockfile on first successful rebuild branch run
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/v2'
        run: |
          if test -f package-lock.json && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(g1): lock verified dependencies"
            git push origin HEAD:rebuild/v2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: g1-static-bundle
          path: |
            dist/
            package-lock.json
          if-no-files-found: error
