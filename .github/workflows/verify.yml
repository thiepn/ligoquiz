name: Verify v2 foundation
on:
  push:
    branches: ['rebuild/v2', 'feature/g5-shared-experience', 'feature/g6-quiztafel', 'feature/g8-logikleiter', 'feature/g9-umfrageduell']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade npm resolver
        run: npm install --global npm@11
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types, lint and unit tests
        run: npm run verify
      - name: Build static bundle
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: v2-static-bundle
          path: dist/
          if-no-files-found: error
