name: Verify v2 foundation
on:
  push:
    branches: ['rebuild/v2']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade npm resolver (avoid npm 10 Arborist regression)
        run: npm install --global npm@11
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify types, lint and unit tests
        run: npm run verify
      - name: Build static production bundle
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: g1-static-bundle
          path: dist/
          if-no-files-found: error
