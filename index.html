/* --- Prototype 0 UI consistency pass --- */
:root{
  --control-h:48px;
  --control-h-lg:56px;
  --setup-max:1320px;
}
button,input,select{max-width:100%}
button{line-height:1.15}
.wizard>*{max-width:var(--setup-max);margin-left:auto;margin-right:auto}
.wizard-grid>*{min-width:0}
.panel-light{min-width:0;overflow:hidden}
.wizard-head{gap:24px}
.wizard .lead{line-height:1.45}

/* Equal, predictable option controls */
.choice-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;align-items:stretch;width:100%;max-width:480px}
.choice{width:100%;min-width:0;height:var(--control-h-lg);min-height:var(--control-h-lg);padding:0 18px;line-height:1.05;white-space:nowrap}
.choice.active{box-shadow:inset 0 0 0 1px #17191d}
.settings-grid{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px 20px;align-items:center;margin-top:14px}
.settings-grid>b{min-width:0;line-height:1.25}
.settings-grid>select{width:180px;justify-self:end;min-height:var(--control-h)}
.settings-grid>.choice-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:180px;max-width:none;justify-self:end}
.settings-grid>.choice-row .choice{width:100%;min-width:0;height:var(--control-h);min-height:var(--control-h);padding:0 6px}
.settings-grid>.toggle{justify-self:end}

/* Switches must never shrink or overflow */
.toggle-card{gap:20px;min-height:86px}
.toggle-card>div{flex:1 1 auto;min-width:0}
.toggle-card>div>div{line-height:1.35}
.toggle{position:relative;display:block;flex:0 0 60px;width:60px;min-width:60px;max-width:60px;height:32px;min-height:32px;max-height:32px;padding:0;overflow:hidden}
.toggle:after{position:absolute;left:3px;top:3px;width:26px;height:26px;margin:0}
.toggle.on:after{transform:translateX(28px)}

/* Setup rows */
.team-edit{grid-template-columns:40px 8px minmax(0,1fr) 128px;gap:12px;width:100%}
.team-edit input,.team-edit select{height:var(--control-h);min-height:var(--control-h)}
.team-edit .stripe{height:var(--control-h)}
.wizard-actions{gap:16px}
.wizard-actions .btn{min-width:132px}
.game-card{min-width:0;border-width:1px}
.game-card.active{border-width:1px;box-shadow:inset 0 0 0 1px #17191d}
.game-card>div{min-width:0}
.game-card p{line-height:1.4}
.game-meta{min-width:112px}

/* Host controls: uniform action sizing and no accidental spill */
.host-top{height:auto;min-height:58px;gap:14px}
.host-brand{flex:0 0 auto}
.host-status{min-width:0;flex-wrap:wrap;justify-content:flex-end}
.host-col{overflow-wrap:anywhere}
.team-actions{display:flex;align-items:stretch}
.team-actions .btn{flex:1 1 74px;min-width:0;white-space:nowrap;text-align:center}
.timer-actions .btn{width:100%;padding-inline:8px}
.host-bottom{gap:8px}
.host-bottom .btn{white-space:nowrap}

/* Dialog rows use a single sizing system */
.wager-row,.estimate-row{grid-template-columns:8px minmax(0,1fr) 140px}
.wager-row select,.wager-row input,.estimate-row select,.estimate-row input{width:140px;min-width:0;min-height:42px}
.modal-actions{flex-wrap:wrap}

/* Projector rail stays balanced for 3–5 teams */
.score-cell{min-width:0}
.score-name{min-width:0}
.score-num{white-space:nowrap}

@media(max-width:1180px){
  .host-body{grid-template-columns:200px minmax(0,1fr) 290px}
  .host-col{padding:14px}
  .host-bottom{flex-wrap:wrap}
  .host-bottom .push{margin-left:auto}
}
@media(max-width:820px){
  .host-body{grid-template-columns:1fr}
}
@media(max-width:900px){
  .wizard-head{margin-bottom:36px}
  .wizard-grid{gap:28px}
  .team-edit{grid-template-columns:36px 8px minmax(0,1fr) 118px;gap:10px}
  .game-card{padding:22px}
  .settings-grid{grid-template-columns:minmax(0,1fr) 170px}
  .settings-grid>select,.settings-grid>.choice-row{width:170px}
}
@media(max-width:680px){
  .wizard{padding:24px 16px 32px}
  .wizard-head{margin-bottom:30px;align-items:flex-start}
  .wizard-step{font-size:15px;white-space:nowrap}
  .wizard .lead{font-size:18px;margin-bottom:28px}
  .wizard-grid{gap:22px}
  .choice-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));width:100%;max-width:none}
  .choice{width:100%;min-width:0;padding:0 10px}
  .team-edit{grid-template-columns:34px 8px minmax(0,1fr);align-items:center}
  .team-edit select{grid-column:3;width:100%}
  .toggle-card{padding:16px;gap:14px}
  .settings-grid{grid-template-columns:1fr;gap:8px;margin-top:16px}
  .settings-grid>b{margin-top:10px}
  .settings-grid>b:first-child{margin-top:0}
  .settings-grid>select,.settings-grid>.choice-row{width:100%;justify-self:stretch}
  .settings-grid>.toggle{justify-self:start;margin:2px 0 6px}
  .wizard-actions{align-items:stretch;flex-direction:column-reverse;margin-top:30px}
  .wizard-actions .btn{width:100%;min-width:0}
  .game-card{grid-template-columns:42px minmax(0,1fr);gap:14px;padding:18px}
  .game-meta{grid-column:2;min-width:0;text-align:left}
  .game-card h2{font-size:31px}

   Secondary: #c7cbcd #2e2e2e #c2ab5c

  --ligo-yellow:#f8e87e;
  --ligo-blue:#98a7c0;
  --ligo-cream:#fcf3d7;
  --ligo-grey:#c7cbcd;

  --ligo-gold:#c2ab5c;
  --night:#2e2e2e;
  --stage:#2e2e2e;
  --surface:#2e2e2e;
  --paper:#fcf3d7;
  --text:#fcf3d7;
  --muted:#c7cbcd;
  --border:#98a7c0;
  --light:#f8e87e;
  --correct:#c2ab5c;
  --wrong:#98a7c0;
  --warning:#f8e87e;
  --focus:#f8e87e;
  --team-blue:#98a7c0;
  --team-red:#c2ab5c;
  --team-green:#f8e87e;
  --team-purple:#c7cbcd;
  --team-orange:#fcf3d7;
  --display:'Poppins','Segoe UI',Arial,sans-serif;
  --font-ui:'Poppins','Segoe UI',Arial,sans-serif;
  --font-title:'Poppins','Segoe UI',Arial,sans-serif;
  --fun-soft:rgba(248,232,126,.24);

  --v14-soft:#fcf3d7;

  --v14-ink:#2e2e2e;

function uid(){return (crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36));}

function clone(x){return JSON.parse(JSON.stringify(x));}
function loadJSON(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}

function sessionKey(id){return PREFIX+'session.'+id;}
function mergeDefaults(target,defaults){const out=(target&&typeof target==='object'&&!Array.isArray(target))?target:{};for(const [k,v] of Object.entries(defaults)){if(out[k]===undefined)out[k]=clone(v);else if(v&&typeof v==='object'&&!Array.isArray(v))out[k]=mergeDefaults(out[k],v);}return out;}
function normalizeSession(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))return null;if(Number(raw.schemaVersion)>SCHEMA)return null;const s=clone(raw);const defaults=newSessionTemplate(s.id||uid());mergeDefaults(s,defaults);s.schemaVersion=SCHEMA;if(!Array.isArray(s.teams)||s.teams.length<3||s.teams.length>5)return null;s.teams=s.teams.map((t,i)=>({id:String(t?.id||uid()),name:String(t?.name||('Team '+(i+1))).slice(0,24),color:TEAM_COLORS.includes(t?.color)?t.color:TEAM_COLORS[i%TEAM_COLORS.length],score:Number.isFinite(Number(t?.score))?Number(t.score):0,order:i}));if(!['setup','ready','playing','paused','results'].includes(s.status))s.status='setup';const screens=['teams','equipment','gameSelect','gameConfig','rules','practice','roundIntro','between','playing','results','tiebreaker'];if(!screens.includes(s.screen))s.screen='teams';if(s.game&& !['roundshow','classic','connections','logic','survey'].includes(s.game.type))s.game=null;if(s.game?.type==='roundshow'){s.game.pending=s.game.pending||{};s.game.quick=mergeDefaults(s.game.quick||{},{attempts:0,selectedTeam:null,attemptedTeamIds:[]});if(!Array.isArray(s.game.quick.attemptedTeamIds))s.game.quick.attemptedTeamIds=[];}if(s.game?.type==='classic'){s.game.used=Array.isArray(s.game.used)?s.game.used:[];s.game.riskIds=Array.isArray(s.game.riskIds)?s.game.riskIds:[];if(Array.isArray(s.game.tiles)&&s.game.tiles.some(id=>String(id).startsWith('cb-'))){s.game=null;s.screen='gameConfig';s.status='setup';s.selectedGame='classic';}}s.undoStack=Array.isArray(s.undoStack)?s.undoStack.slice(-100):[];s.scoreHistory=Array.isArray(s.scoreHistory)?s.scoreHistory:[];s.timer=mergeDefaults(s.timer||{},{status:'idle',durationMs:30000,baseDurationMs:Number(s.timer?.durationMs)||30000,startedAt:null,pausedRemainingMs:null});if(!['idle','running','paused','expired'].includes(s.timer.status))s.timer.status='idle';if(s.timer.status==='running'&&!Number.isFinite(Number(s.timer.startedAt)))s.timer.status='idle';if(s.timer.status==='running'&&Math.max(0,Number(s.timer.durationMs||0)-(now()-Number(s.timer.startedAt)))<=0){s.timer.status='expired';s.timer.pausedRemainingMs=0;}s.paused=!!s.paused;return s;}
function safeSessionWrite(){if(!state)return false;const key=sessionKey(state.id),tmp=key+'.tmp',bak=key+'.backup';try{const next=JSON.stringify(state),previous=localStorage.getItem(key);if(previous)localStorage.setItem(bak,previous);localStorage.setItem(tmp,next);localStorage.setItem(key,next);localStorage.removeItem(tmp);localStorage.setItem(PREFIX+'lastSession',state.id);storageHealthy=true;return true}catch(e){storageHealthy=false;console.error('Spielstand konnte nicht gespeichert werden',e);return false;}}
function fmtTime(ms){ms=Math.max(0,ms||0);const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function teamColor(t){return COLOR_HEX[t.color]||'#fff';}
function ranks(){const winner=state?.game?.tiebreakWinnerId;return [...(state?.teams||[])].sort((a,b)=>{const d=b.score-a.score;if(d)return d;if(winner){if(a.id===winner)return -1;if(b.id===winner)return 1;}return a.order-b.order;});}

function currentTimerRemaining(){if(!state?.timer)return 0;const t=state.timer;if(t.status==='running')return Math.max(0,t.durationMs-(now()-t.startedAt));if(t.status==='paused')return Math.max(0,t.pausedRemainingMs||0);if(t.status==='expired')return 0;return t.durationMs||0;}
function timerClass(){const sec=currentTimerRemaining()/1000;return sec<=5?'danger':sec<=10?'warn':'';}
function isTimerExpired(){return state?.timer?.status==='running'&&currentTimerRemaining()<=0;}

function openChannel(id){if(channel)channel.close();try{channel=new BroadcastChannel('ligo-quiz-'+id);channel.onmessage=e=>{const m=e.data||{};if(isDisplay&&m.type==='state'){const next=normalizeSession(m.state);if(next){state=next;render();}}if(isDisplay&&m.type==='ping'){channel.postMessage({type:'pong',time:now()});}if(!isDisplay&&m.type==='pong'){lastPing=now();updateConnectionIndicator();}};}catch(e){console.warn('BroadcastChannel unavailable',e);channel=null;}}
function ping(){if(!isDisplay&&channel){channel.postMessage({type:'ping',time:now()});updateConnectionIndicator();}}
function updateConnectionIndicator(){const el=document.getElementById('displayStatus');if(!el)return;const on=now()-lastPing<11000;el.innerHTML=`<span class="dot ${on?'on':''}"></span> BEAMER ${on?'VERBUNDEN':'NICHT ERKANNT'}`;}

function actionBlocked(key,ms=420){const t=now(),last=actionLock.get(key)||0;if(t-last<ms)return true;actionLock.set(key,t);return false;}

function newSessionTemplate(id){return {schemaVersion:SCHEMA,id,createdAt:now(),updatedAt:now(),status:'setup',screen:'teams',teams:[],equipment:{buzzers:false,whiteboards:false,paperPens:true},selectedGame:'roundshow',config:{roundshow:{preset:'standard',timers:{everybody:30,media:25,think:45,quickfire:15,final:60}},classic:{board:'standard',mainTimer:25,stealTimer:8,riskTiles:2,finalWager:true}},game:null,timer:{status:'idle',durationMs:30000,baseDurationMs:30000,startedAt:null,pausedRemainingMs:null},paused:false,pauseTimerWasRunning:false,undoStack:[],scoreHistory:[]};}
function newSession(){const base=newSessionTemplate(uid());base.teams=Array.from({length:4},(_,i)=>({id:uid(),name:'Team '+(i+1),color:TEAM_COLORS[i],score:0,order:i}));return base;}
function loadSession(id){lastLoadRecovered=false;if(!id)return null;const key=sessionKey(id);let raw=loadJSON(key,null),s=normalizeSession(raw);if(!s){const backup=loadJSON(key+'.backup',null);s=normalizeSession(backup);if(s)lastLoadRecovered=true;}return s;}
function startNewNight(){state=newSession();querySession=state.id;openChannel(state.id);persist();render();}
function resumeLast(){const id=localStorage.getItem(PREFIX+'lastSession');const x=id&&loadSession(id);if(!x){toast('Kein sicherer Spielstand zum Fortsetzen gefunden');return;}state=x;querySession=id;openChannel(id);persist();render();if(lastLoadRecovered)setTimeout(()=>toast('Sicherungskopie des letzten Spielstands wiederhergestellt'),100);}

function currentChallenge(){if(!state?.game)return null;if(state.game.type==='roundshow'){if(state.game.practice)return PRACTICE.roundshow;const r=state.game.roundIndex;if(r===4)return RS.find(x=>x.round===4);const list=state.game.rounds[r]||[];return list[state.game.itemIndex]||null;}if(state.game.type==='classic'){if(state.game.practice)return PRACTICE.classic;return CB.find(x=>x.id===state.game.currentTileId)||state.game.finalChallenge||null;}return null;}
function startTimer(sec){setState(s=>{s.timer={status:'running',durationMs:sec*1000,baseDurationMs:sec*1000,startedAt:now(),pausedRemainingMs:null};});}
function pauseTimer(){if(!state?.timer)return;setState(s=>{const t=s.timer;if(t.status==='running'){t.pausedRemainingMs=Math.max(0,t.durationMs-(now()-t.startedAt));t.status='paused';}else if(t.status==='paused'){t.durationMs=t.pausedRemainingMs;t.startedAt=now();t.status='running';}},{});}
function addTime(sec){setState(s=>{const t=s.timer;if(t.status==='running')t.durationMs+=sec*1000;else if(t.status==='paused'){t.pausedRemainingMs=(t.pausedRemainingMs||0)+sec*1000;t.durationMs=t.pausedRemainingMs;}else{t.durationMs=(t.durationMs||0)+sec*1000;t.baseDurationMs=t.durationMs;t.pausedRemainingMs=t.durationMs;}},{});}
function restartTimer(){setState(s=>{const t=s.timer;t.durationMs=t.baseDurationMs||t.durationMs||30000;t.status='running';t.startedAt=now();t.pausedRemainingMs=null;});}
function endTimer(){setState(s=>{s.timer.status='expired';s.timer.pausedRemainingMs=0;});sound('wrong');}
function resetTimer(sec){state.timer={status:'idle',durationMs:sec*1000,baseDurationMs:sec*1000,startedAt:null,pausedRemainingMs:null};}
function tick(){if(!state)return;if(isTimerExpired()){state.timer.status='expired';state.timer.pausedRemainingMs=0;persist();sound('timer');renderTimerOnly();return;}renderTimerOnly();if(!isDisplay)ping();}
function renderTimerOnly(){const ms=currentTimerRemaining();document.querySelectorAll('[data-timer]').forEach(el=>{el.textContent=state?.timer?.status==='expired'?'ZEIT':fmtTime(ms);el.classList.remove('warn','danger');const c=timerClass();if(c)el.classList.add(c);});updateConnectionIndicator();}

function score(teamId,delta,source='manual',challengeId){setState(s=>{const t=s.teams.find(x=>x.id===teamId);if(!t)return;t.score+=delta;s.scoreHistory.push({teamId,delta,source,challengeId,timestamp:now()});}, {undo:true});sound(delta>=0?'correct':'wrong');}
function setScore(teamId,value){const t=getTeam(teamId);if(!t)return;const delta=value-t.score;score(teamId,delta,'manual');}
function sound(type){if(!settings.sound||isDisplay)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);let f=440,d=.12;if(type==='correct'){f=660;d=.16}else if(type==='wrong'||type==='timer'){f=180;d=.18}else if(type==='reveal'){f=520;d=.08}else if(type==='round'){f=360;d=.2}o.frequency.value=f;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.start();o.stop(ctx.currentTime+d);setTimeout(()=>ctx.close(),500);}catch{}}
function playChallengeAudio(ch){if(!ch?.media||ch.media.type!=='audio')return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();let t=ctx.currentTime+.05;if(ch.media.tones){ch.media.tones.forEach((f,i)=>{const d=(ch.media.durations||[])[i]||.3;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);t+=d+.08;});}else if(ch.media.morse){const unit=.12;for(const c of ch.media.morse){if(c===' '){t+=unit*3;continue}const d=c==='.'?unit:unit*3;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=620;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);t+=d+unit;}}setTimeout(()=>ctx.close(),5000);}catch(e){toast('Der Ton konnte nicht abgespielt werden');}}

function buildRoundShow(){resetScores();const p=state.config.roundshow.preset;const counts=p==='short'?[3,3,2,3,1]:[5,5,4,5,1];const rounds=[];for(let r=0;r<5;r++)rounds[r]=RS.filter(x=>x.round===r).slice(0,counts[r]);state.status='ready';state.game={type:'roundshow',roundIndex:0,itemIndex:0,rounds,phase:'rules',practice:false,pending:{},quick:{attempts:0,selectedTeam:null,attemptedTeamIds:[]},wagers:{},finalRevealed:false,tieIndex:0};state.screen='rules';resetTimer(state.config.roundshow.timers.everybody);persist();render();}
function buildClassic(){resetScores();const cfg=state.config.classic;const cats=[...new Set(CB.map(x=>x.cat))];const useCats=cfg.board==='short'?cats.slice(0,4):cats;const rows=cfg.board==='short'?4:5;const tiles=CB.filter(x=>useCats.includes(x.cat)&&x.row<rows).map(x=>x.id);const riskIds=[];const candidate=[tiles[Math.min(7,tiles.length-1)],tiles[Math.min(18,tiles.length-1)]].filter(Boolean);for(let i=0;i<Math.min(cfg.riskTiles,candidate.length);i++)riskIds.push(candidate[i]);state.status='ready';state.game={type:'classic',categories:useCats,rows,tiles,used:[],riskIds,selectorIndex:0,currentTileId:null,stage:'board',riskMode:null,stealTeam:null,practice:false,answerRevealed:false,finalEnabled:cfg.finalWager,finalStage:null,wagers:{},finalChallenge:{id:'cb-final',type:'text',prompt:'Welcher Kontinent wird von jedem Längengrad durchquert?',answer:'Antarktika',acceptedAnswers:['Antarktika'],category:'FINALWETTE',difficulty:3,points:0,durationSec:60}};state.screen='rules';resetTimer(cfg.mainTimer);persist();render();}
function launchSelected(){if(state.selectedGame==='roundshow')buildRoundShow();else buildClassic();}
function startGameFromRules(){setState(s=>{s.screen='roundIntro';s.status='ready';s.game.phase='roundIntro';});sound('round');}
function startPractice(){setState(s=>{s.game.practice=true;s.screen='practice';s.game.phase='practice';const ch=currentChallenge();resetTimer(ch?.durationSec||20);});}
function endPractice(){setState(s=>{s.game.practice=false;s.screen='roundIntro';s.game.phase='roundIntro';});}
function startCurrentRound(){if(state.game.type==='roundshow'){setState(s=>{s.screen='playing';s.status='playing';s.game.phase=s.game.roundIndex===4?'wagers':'question';s.game.pending={};s.game.quick={attempts:0,selectedTeam:null,attemptedTeamIds:[]};const ch=currentChallenge();resetTimer(roundTimer(s.game.roundIndex));});}else{setState(s=>{s.screen='playing';s.status='playing';s.game.stage='board';s.game.answerRevealed=false;resetTimer(s.config.classic.mainTimer);});}}
function roundTimer(r){const t=state.config.roundshow.timers;return [t.everybody,t.media,t.think,t.quickfire,t.final][r];}
function nextRoundShow(){const g=state.game;const list=g.rounds[g.roundIndex];if(g.itemIndex<list.length-1){setState(s=>{s.game.itemIndex++;s.game.pending={};s.game.quick={attempts:0,selectedTeam:null,attemptedTeamIds:[]};s.game.phase=s.game.roundIndex===4?'wagers':'question';resetTimer(roundTimer(s.game.roundIndex));},{undo:true});return;}if(g.roundIndex<4){setState(s=>{s.game.roundIndex++;s.game.itemIndex=0;s.game.pending={};s.game.quick={attempts:0,selectedTeam:null,attemptedTeamIds:[]};s.screen='between';s.game.phase='between';resetTimer(roundTimer(s.game.roundIndex));},{undo:true});}else finishGame();}
function applySimultaneous(){const ch=currentChallenge();if(!ch)return;if(ch.type==='estimation'){applyEstimation();return;}pushUndo();for(const t of state.teams){if(state.game.pending[t.id]==='correct'){t.score+=ch.points;state.scoreHistory.push({teamId:t.id,delta:ch.points,source:'correct',challengeId:ch.id,timestamp:now()});}}state.game.phase='resolved';state.game.answerRevealed=true;persist();render();sound('correct');}
function togglePending(teamId,val){setState(s=>{const cur=s.game.pending[teamId];s.game.pending[teamId]=cur===val?null:val;},{});}
function applyEstimation(){const ch=currentChallenge();const vals=state.game.estimates||{};const valid=state.teams.map(t=>({t,v:Number(vals[t.id])})).filter(x=>Number.isFinite(x.v));if(valid.length!==state.teams.length){toast('Bitte für jedes Team eine Schätzung eintragen');return;}valid.sort((a,b)=>Math.abs(a.v-ch.numericAnswer)-Math.abs(b.v-ch.numericAnswer));pushUndo();const bestDist=Math.abs(valid[0].v-ch.numericAnswer);const first=valid.filter(x=>Math.abs(x.v-ch.numericAnswer)===bestDist);first.forEach(x=>{x.t.score+=125;state.scoreHistory.push({teamId:x.t.id,delta:125,source:'correct',challengeId:ch.id,timestamp:now()});});const rest=valid.filter(x=>!first.includes(x));if(rest.length){const secondDist=Math.abs(rest[0].v-ch.numericAnswer);rest.filter(x=>Math.abs(x.v-ch.numericAnswer)===secondDist).forEach(x=>{x.t.score+=75;state.scoreHistory.push({teamId:x.t.id,delta:75,source:'correct',challengeId:ch.id,timestamp:now()});});}state.game.phase='resolved';state.game.answerRevealed=true;persist();render();sound('correct');}
function selectQuickTeam(id){const q=state.game.quick;if(q.attempts>=2||q.attemptedTeamIds?.includes(id))return;setState(s=>{s.game.quick.selectedTeam=id;s.game.phase='quickAttempt';});}
function quickResult(correct){const ch=currentChallenge(),id=state.game.quick.selectedTeam;if(!id)return;pushUndo();const t=getTeam(id);if(!t)return;if(correct){t.score+=100;state.scoreHistory.push({teamId:id,delta:100,source:'correct',challengeId:ch.id,timestamp:now()});state.game.phase='resolved';state.game.answerRevealed=true;}else{t.score-=50;state.scoreHistory.push({teamId:id,delta:-50,source:'incorrect',challengeId:ch.id,timestamp:now()});state.game.quick.attemptedTeamIds=state.game.quick.attemptedTeamIds||[];if(!state.game.quick.attemptedTeamIds.includes(id))state.game.quick.attemptedTeamIds.push(id);state.game.quick.attempts++;if(state.game.quick.attempts>=2){state.game.phase='resolved';state.game.answerRevealed=true;}else{state.game.quick.selectedTeam=null;state.game.phase='question';resetTimer(state.config.roundshow.timers.quickfire);}}persist();render();sound(correct?'correct':'wrong');}
function saveWagers(){const g=state.game;for(const t of state.teams){const v=Number((g.wagers||{})[t.id]??0);if(![0,100,200,300,400,500].includes(v)){toast('Bitte nur Einsätze von 0 bis 500 in 100er-Schritten verwenden');return;}}setState(s=>{s.game.phase='finalQuestion';s.game.finalRevealed=true;resetTimer(s.config.roundshow.timers.final);});}
function applyFinal(){if(!state.teams.every(t=>['correct','wrong'].includes(state.game.pending?.[t.id]))){toast('Bitte jedes Team als richtig oder falsch markieren');return;}pushUndo();for(const t of state.teams){const w=Number(state.game.wagers[t.id]||0);const res=state.game.pending[t.id];const delta=res==='correct'?w:-w;t.score+=delta;state.scoreHistory.push({teamId:t.id,delta,source:'wager',challengeId:'rs-f1',timestamp:now()});}state.game.phase='resolved';state.game.answerRevealed=true;persist();render();sound('round');}

function openTile(id){if(state.game.used.includes(id))return;const ch=CB.find(x=>x.id===id);setState(s=>{s.game.currentTileId=id;s.game.answerRevealed=false;s.game.stealTeam=null;s.game.riskMode=null;if(s.game.riskIds.includes(id)){s.game.stage='riskChoice';}else{s.game.stage='question';resetTimer(s.config.classic.mainTimer);} });}
function chooseRisk(mode){setState(s=>{s.game.riskMode=mode;s.game.stage='question';resetTimer(s.config.classic.mainTimer);});}
function classicCorrect(teamId){const g=state.game,ch=currentChallenge();let delta=ch.points;if(g.riskMode==='risk')delta*=2;score(teamId,delta,'correct',ch.id);resolveClassic(false);}
function classicWrong(teamId){const g=state.game,ch=currentChallenge();if(g.riskMode==='risk'){score(teamId,-ch.points,'risk',ch.id);resolveClassic(false);return;}if(g.riskMode==='safe'){resolveClassic(true);return;}setState(s=>{s.game.stage='steal';s.game.stealTeam=null;resetTimer(s.config.classic.stealTimer);},{undo:true});}
function selectSteal(id){if(id===state.teams[state.game.selectorIndex].id)return;setState(s=>{s.game.stealTeam=id;});}
function stealResult(correct){const g=state.game,ch=currentChallenge(),id=g.stealTeam;if(!id){toast('Zuerst das Team für die Klauchance auswählen');return;}if(correct){score(id,ch.points,'steal',ch.id);resolveClassic(false);}else resolveClassic(true);}
function resolveClassic(recordUndo=false){setState(s=>{const g=s.game;if(!g.used.includes(g.currentTileId))g.used.push(g.currentTileId);g.answerRevealed=true;g.stage='resolved';},{undo:recordUndo});}
function backToBoard(){setState(s=>{const g=s.game;g.selectorIndex=(g.selectorIndex+1)%s.teams.length;g.currentTileId=null;g.stage='board';g.riskMode=null;g.stealTeam=null;g.answerRevealed=false;resetTimer(s.config.classic.mainTimer);},{undo:true});}
function maybeClassicFinal(){const g=state.game;if(g.used.length<g.tiles.length)return false;if(g.finalEnabled){setState(s=>{s.game.stage='finalWagers';s.game.currentTileId=null;s.game.wagers={};s.game.pending={};});}else finishGame();return true;}
function classicSaveWagers(){for(const t of state.teams){const v=Number(state.game.wagers[t.id]??0);if(![0,100,200,300,400,500].includes(v)){toast('Bitte nur Einsätze von 0 bis 500 in 100er-Schritten verwenden');return;}}setState(s=>{s.game.stage='finalQuestion';resetTimer(60);});}
function classicApplyFinal(){if(!state.teams.every(t=>['correct','wrong'].includes(state.game.pending?.[t.id]))){toast('Bitte jedes Team als richtig oder falsch markieren');return;}pushUndo();for(const t of state.teams){const w=Number(state.game.wagers[t.id]||0),res=state.game.pending[t.id],delta=res==='correct'?w:-w;t.score+=delta;state.scoreHistory.push({teamId:t.id,delta,source:'wager',challengeId:'cb-final',timestamp:now()});}state.game.stage='finalResolved';state.game.answerRevealed=true;persist();render();}
function finishGame(){setState(s=>{s.screen='results';s.status='results';s.paused=false;});sound('round');}
function startTiebreak(){const r=ranks(),top=r[0]?.score,tied=r.filter(t=>t.score===top).map(t=>t.id);setState(s=>{s.screen='tiebreaker';s.game.tiebreakIndex=s.game.tiebreakIndex||0;s.game.tiebreakTiedIds=tied;s.game.tiebreakEstimates={};s.game.tiebreakWinnerId=null;resetTimer(TIEBREAKERS[s.game.tiebreakIndex]?.durationSec||45);});}
function applyTiebreak(){const g=state.game,ch=TIEBREAKERS[g.tiebreakIndex||0],ids=g.tiebreakTiedIds||[];const vals=ids.map(id=>({id,v:Number(g.tiebreakEstimates?.[id])})).filter(x=>Number.isFinite(x.v));if(vals.length!==ids.length){toast('Für jedes Team mit Gleichstand eine Schätzung eintragen');return;}vals.sort((a,b)=>Math.abs(a.v-ch.numericAnswer)-Math.abs(b.v-ch.numericAnswer));const best=Math.abs(vals[0].v-ch.numericAnswer),winners=vals.filter(x=>Math.abs(x.v-ch.numericAnswer)===best);if(winners.length===1){setState(s=>{s.game.tiebreakWinnerId=winners[0].id;s.screen='results';s.status='results';},{undo:true});sound('round');return;}if((g.tiebreakIndex||0)<TIEBREAKERS.length-1){setState(s=>{s.game.tiebreakIndex=(s.game.tiebreakIndex||0)+1;s.game.tiebreakTiedIds=winners.map(x=>x.id);s.game.tiebreakEstimates={};resetTimer(TIEBREAKERS[s.game.tiebreakIndex].durationSec||45);},{undo:true});toast('Weiterhin Gleichstand – nächste Stechfrage');}else{toast('Auch nach allen vorbereiteten Stechfragen besteht Gleichstand');}}
function pauseGame(){setState(s=>{if(!s.paused){s.paused=true;s.status='paused';s.pauseTimerWasRunning=s.timer.status==='running';if(s.pauseTimerWasRunning){s.timer.pausedRemainingMs=Math.max(0,s.timer.durationMs-(now()-s.timer.startedAt));s.timer.status='paused';}}else{s.paused=false;s.status=s.screen==='results'?'results':'playing';if(s.pauseTimerWasRunning&&s.timer.status==='paused'){s.timer.durationMs=s.timer.pausedRemainingMs;s.timer.startedAt=now();s.timer.status='running';}s.pauseTimerWasRunning=false;}});}

function render(){if(isDisplay){renderDisplay();}else renderHostOrSetup();renderTimerOnly();}
function app(html){document.getElementById('app').innerHTML=html;bindCommon();}
function bindCommon(){document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',handleAction));document.querySelectorAll('[data-change]').forEach(el=>el.addEventListener('change',handleChange));document.querySelectorAll('[data-input]').forEach(el=>el.addEventListener('input',handleInput));}
function handleAction(e){const a=e.currentTarget.dataset.action;const id=e.currentTarget.dataset.id;const v=e.currentTarget.dataset.value;if(GUARDED_ACTIONS.has(a)&&actionBlocked(a+':'+(id||'')))return;
  const map={startNew:startNewNight,resume:resumeLast,backHome:()=>{state=null;render();},nextEquipment:()=>setState(s=>s.screen='equipment'),backTeams:()=>setState(s=>s.screen='teams'),nextGame:()=>setState(s=>s.screen='gameSelect'),backEquipment:()=>setState(s=>s.screen='equipment'),nextConfig:()=>setState(s=>s.screen='gameConfig'),backGame:()=>setState(s=>s.screen='gameSelect'),launch:launchSelected,startRules:startGameFromRules,practice:startPractice,endPractice:endPractice,startRound:startCurrentRound,undo,openDisplay,fullscreen:toggleFullscreen,pauseGame,finish:finishGame,nextRS:nextRoundShow,applySim:applySimultaneous,saveWagers,applyFinal,classicBoard:backToBoard,classicFinal:()=>maybeClassicFinal(),classicSaveWagers,classicApplyFinal,finishNight:()=>{state.status='results';persist();render();},runTiebreak:startTiebreak,applyTiebreak,anotherGame:()=>setState(s=>{s.screen='gameSelect';s.status='setup';s.game=null;resetScores();}),settings:showSettings,library:showLibrary,scoreEditor:showScoreEditor,closeModal:closeModal,timerStart:()=>{const sec=Math.round((state.timer.durationMs||30000)/1000);startTimer(sec)},timerPause:pauseTimer,timerAdd:()=>addTime(10),timerRestart:restartTimer,timerEnd:endTimer,reveal:()=>setState(s=>{if(s.game)s.game.answerRevealed=true;}),audio:()=>playChallengeAudio(currentChallenge())};
  if(map[a]){map[a]();return}
  if(a==='teamCount'){setTeamCount(Number(v));return}if(a==='toggleEquip'){setState(s=>s.equipment[v]=!s.equipment[v]);return}if(a==='selectGame'){setState(s=>s.selectedGame=v);return}if(a==='presetRS'){setState(s=>s.config.roundshow.preset=v);return}if(a==='boardPreset'){setState(s=>{s.config.classic.board=v;if(v==='short'){s.config.classic.customCats=4;s.config.classic.customRows=4;}else if(v==='standard'){s.config.classic.customCats=5;s.config.classic.customRows=5;}else if(v==='large'){s.config.classic.customCats=6;s.config.classic.customRows=5;}ensureClassicSelection(s.config.classic);});return}if(a==='toggleFinal'){setState(s=>s.config.classic.finalWager=!s.config.classic.finalWager);return}if(a==='riskCount'){setState(s=>s.config.classic.riskTiles=Number(v));return}if(a==='pending'){togglePending(id,v);return}if(a==='selectQuick'){selectQuickTeam(id);return}if(a==='quickCorrect'){quickResult(true);return}if(a==='quickWrong'){quickResult(false);return}if(a==='openTile'){openTile(id);return}if(a==='riskMode'){chooseRisk(v);return}if(a==='classicCorrect'){classicCorrect(id);return}if(a==='classicWrong'){classicWrong(id);return}if(a==='selectSteal'){selectSteal(id);return}if(a==='stealCorrect'){stealResult(true);return}if(a==='stealWrong'){stealResult(false);return}if(a==='manualPlus'){manualAdjust(id,1);return}if(a==='manualMinus'){manualAdjust(id,-1);return}if(a==='manualSet'){manualSet(id);return}if(a==='classicResolveNoSteal'){resolveClassic(true);return}
}
function handleChange(e){const key=e.currentTarget.dataset.change,val=e.currentTarget.value,id=e.currentTarget.dataset.id;if(key==='teamColor')setState(s=>{const t=s.teams.find(x=>x.id===id);if(t)t.color=val;});if(key==='rsTimer')setState(s=>s.config.roundshow.timers[id]=Number(val));if(key==='classicTimer')setState(s=>s.config.classic[id]=val==='off'?0:Number(val));if(key==='wager')setState(s=>s.game.wagers[id]=Number(val));}
function handleInput(e){const key=e.currentTarget.dataset.input,id=e.currentTarget.dataset.id,val=e.currentTarget.value;if(key==='teamName'){const t=state.teams.find(x=>x.id===id);t.name=val.slice(0,24);persist(false);}if(key==='estimate'){state.game.estimates=state.game.estimates||{};state.game.estimates[id]=val;persist();}if(key==='wager'){state.game.wagers[id]=Number(val);persist();}if(key==='tiebreakEstimate'){state.game.tiebreakEstimates=state.game.tiebreakEstimates||{};state.game.tiebreakEstimates[id]=val;persist();}}
function manualAdjust(id,sign){const raw=prompt(sign>0?'Wie viele Punkte hinzufügen?':'Wie viele Punkte abziehen?','100');if(raw===null)return;const n=Math.abs(Number(raw));if(!Number.isFinite(n))return;score(id,sign*n,'manual');}
function manualSet(id){const t=getTeam(id);const raw=prompt('Punktestand festlegen für '+t.name,t.score);if(raw===null)return;const n=Number(raw);if(Number.isFinite(n))setScore(id,n);}
function setTeamCount(n){setState(s=>{while(s.teams.length<n){const i=s.teams.length;s.teams.push({id:uid(),name:'Team '+(i+1),color:TEAM_COLORS[i],score:0,order:i});}s.teams=s.teams.slice(0,n);s.teams.forEach((t,i)=>t.order=i);});}
function openDisplay(){if(!state)return;const url=location.href.split('?')[0]+'?view=display&session='+encodeURIComponent(state.id);const w=window.open(url,'ligo-projector','width=1280,height=720');if(!w){toast('Beameransicht wurde vom Browser blockiert – Pop-ups für diese Seite erlauben');return;}try{w.focus();}catch{}setTimeout(ping,600);}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}

function showLibrary(){const d=document.createElement('div');d.className='modal-backdrop';d.innerHTML=`<div class="modal"><h2>Spiele im Prototyp</h2><p><b>Rundenquiz</b><br>Fünf abwechslungsreiche Runden für möglichst viel Beteiligung in etwa 45–60 Minuten.</p><p><b>Quiztafel</b><br>Kategorien, Punktwerte, feste Reihenfolge, eine Klauchance, versteckte Risikofelder und eine optionale Finalwette.</p><p class="muted">Verbindungen, Logikleiter, Umfrageduell und ein vollständiger Frageneditor kommen bewusst erst nach dem Test von Prototyp 0.</p><div class="modal-actions"><button class="btn primary">Fertig</button></div></div>`;document.body.appendChild(d);d.querySelector('button').onclick=()=>d.remove();}

function renderHostOrSetup(){if(!state){renderHome();return;}if(['teams','equipment','gameSelect','gameConfig'].includes(state.screen)){renderWizard();return;}renderHost();}
function renderHome(){const id=localStorage.getItem(PREFIX+'lastSession'),saved=id&&loadSession(id);app(`<div class="setup-shell"><main class="setup-main"><div class="brand">LiGo / Quizabend</div><section class="hero"><h1>QUIZ<br>ABEND</h1><div class="tagline">GEMEINSAM SPIELEN.</div><div class="setup-nav"><button class="btn primary big" data-action="startNew">QUIZABEND STARTEN →</button>${saved?'<button class="btn big" data-action="resume">LETZTES SPIEL FORTSETZEN</button>':''}<button class="btn" data-action="library">SPIELE</button><button class="btn" data-action="settings">EINSTELLUNGEN</button></div></section><div class="version">Phase 1 · live-event-gehärtet · lokal gespeichert</div></main><aside class="setup-light"></aside></div>`);}

function scoreHistory(){const recent=(state.scoreHistory||[]).slice(-8).reverse();return `<div class="host-score-history"><div class="host-label">PUNKTEVERLAUF</div>${recent.length?recent.map(h=>`<div class="history-row"><span>${esc(getTeam(h.teamId)?.name||'Team')}</span><b>${h.delta>=0?'+':''}${h.delta}</b></div>`).join(''):'<div>Noch keine Punkteänderungen.</div>'}</div>`;}
function renderHost(){const content=hostMainContent();app(`<div class="host ${esc(state.screen)}">${hostTop()}<div class="host-body">${content}</div>${hostBottom()}</div>`);if(state.screen==='results')setTimeout(()=>{},0);}
function hostMainContent(){if(state.paused)return `<div class="host-col"><h2 class="host-title">Spiel pausiert</h2>${timerHost()}</div><div class="host-col"><div class="question-host">Die Beameransicht ist pausiert. Fortsetzen, sobald der Raum bereit ist.</div></div><div class="host-col">${hostTeams()}${scoreHistory()}</div>`;if(state.screen==='rules')return hostRules();if(state.screen==='practice')return hostPractice();if(state.screen==='roundIntro')return hostRoundIntro();if(state.screen==='between')return hostBetween();if(state.screen==='results')return hostResults();if(state.screen==='tiebreaker')return hostTiebreaker();if(state.screen==='playing')return state.game.type==='roundshow'?hostRoundShow():hostClassic();return ''}
function hostRules(){const name=state.game.type==='roundshow'?'Rundenquiz':'Quiztafel';return `<div class="host-col"><div class="host-label">BEREIT</div><h2 class="host-title">${name}</h2><div class="host-message">Öffne die Beameransicht, erkläre die Kurzregeln und starte bei Bedarf zuerst die Proberunde ohne Punkte.</div></div><div class="host-col"><h2 class="host-title">Regelübersicht</h2><div class="question-host">Auf dem Beamer stehen gerade die Kurzregeln für ${name}.</div><button class="btn" data-action="practice">PROBERUNDE</button> <button class="btn primary" data-action="startRules">SPIEL STARTEN →</button></div><div class="host-col">${hostTeams()}${scoreHistory()}</div>`;}
function hostPractice(){const ch=currentChallenge();return `<div class="host-col"><div class="host-label">PROBERUNDE</div><h2 class="host-title">Keine Punkte</h2>${timerHost()}</div><div class="host-col"><div class="host-label">FRAGE</div><div class="question-host">${esc(ch.prompt)}</div><div class="answer-box ${state.game?.answerRevealed?'answer-revealed':''}"><div class="host-label">ANTWORT ${state.game?.answerRevealed?'· AM BEAMER SICHTBAR':'· NUR SPIELLEITUNG'}</div><div class="answer">${esc(ch.answer)}</div></div><button class="btn" data-action="reveal">ANTWORT ZEIGEN</button></div><div class="host-col">${hostTeams()}<button class="btn primary" style="width:100%;margin-top:10px" data-action="endPractice">PROBERUNDE BEENDEN →</button></div>`;}
function hostRoundIntro(){const title=state.game.type==='roundshow'?ROUND_NAMES[state.game.roundIndex]:'QUIZTAFEL';return `<div class="host-col"><div class="host-label">ALS NÄCHSTES</div><h2 class="host-title">${title}</h2></div><div class="host-col"><div class="question-host">Auf dem Beamer steht die Rundenankündigung. Starte, sobald der Raum bereit ist.</div><button class="btn primary big" data-action="startRound">STARTEN →</button></div><div class="host-col">${hostTeams()}</div>`;}
function hostBetween(){const next=ROUND_NAMES[state.game.roundIndex];return `<div class="host-col"><div class="host-label">RUNDE BEENDET</div><h2 class="host-title">Als Nächstes: ${next}</h2></div><div class="host-col"><div class="question-host">Der Zwischenstand wird angezeigt. Nutze die Pause für eine kurze Erklärung oder um den Raum neu zu sammeln.</div><button class="btn primary big" data-action="startRound">${next} STARTEN →</button></div><div class="host-col">${hostTeams()}</div>`;}
function hostResults(){const r=ranks(),winner=state.game?.tiebreakWinnerId?getTeam(state.game.tiebreakWinnerId):r[0],rawTie=r.length>1&&r[0].score===r[1].score,tie=rawTie&&!state.game?.tiebreakWinnerId;return `<div class="host-col"><div class="host-label">BEENDET</div><h2 class="host-title">Ergebnis</h2><div class="host-message">${tie?'An der Spitze herrscht Gleichstand. Starte die eingebaute Schätz-Stechfrage.':state.game?.tiebreakWinnerId?'Der Gleichstand wurde durch die Stechfrage entschieden.':'Der Sieger steht fest.'}</div></div><div class="host-col"><h2 class="host-title">${tie?'GLEICHSTAND AN DER SPITZE':'SIEGER: '+esc(winner?.name||'')}</h2><div class="rank-list">${r.map((t,i)=>`<div class="rank-row"><div class="rank-pos">${i+1}</div><div class="stripe" style="background:${teamColor(t)}"></div><div class="rank-name">${esc(t.name)}</div><div class="rank-score">${t.score}</div></div>`).join('')}</div></div><div class="host-col">${hostTeams()}${tie?'<button class="btn primary" style="width:100%;margin-top:12px" data-action="runTiebreak">STECHFRAGE STARTEN →</button>':''}<button class="btn primary" style="width:100%;margin-top:12px" data-action="anotherGame">NOCH EIN SPIEL</button><button class="btn" style="width:100%;margin-top:8px" data-action="finishNight">ERGEBNIS ANZEIGEN LASSEN</button></div>`;}
function hostTiebreaker(){const g=state.game,ch=TIEBREAKERS[g.tiebreakIndex||0],ids=g.tiebreakTiedIds||[];return `<div class="host-col"><div class="host-label">STECHFRAGE ${Math.min((g.tiebreakIndex||0)+1,TIEBREAKERS.length)} / ${TIEBREAKERS.length}</div><h2 class="host-title">Am nächsten gewinnt</h2>${timerHost()}<div class="host-message">Nur die Teams mit Gleichstand antworten. Trage ihre Zahlenwerte ein und ermittle danach die beste Schätzung.</div></div><div class="host-col">${hostQuestion(ch)}<div class="host-label" style="margin-top:18px">SCHÄTZUNGEN</div>${ids.map(id=>{const t=getTeam(id);return `<label class="estimate-row"><span class="stripe" style="height:38px;background:${teamColor(t)}"></span><b>${esc(t.name)}</b><input type="number" data-input="tiebreakEstimate" data-id="${id}" value="${esc(g.tiebreakEstimates?.[id]??'')}"></label>`}).join('')}</div><div class="host-col">${ids.map(id=>{const t=getTeam(id);return `<div class="team-control pending"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div></div>`}).join('')}<button class="btn primary" style="width:100%;margin-top:10px" data-action="applyTiebreak">BESTE SCHÄTZUNG ERMITTELN →</button></div>`;}
function hostRoundShow(){const g=state.game,ch=currentChallenge(),r=g.roundIndex;let left=`<div class="host-col"><div class="host-label">RUNDE ${r+1} / 5</div><h2 class="host-title">${ROUND_NAMES[r]}</h2><div class="progress-text">Frage ${g.itemIndex+1} / ${g.rounds[r].length}</div>${g.phase!=='wagers'?timerHost():''}<div class="host-message">${r===3?(state.equipment.buzzers?'Antworttaster aktiv: Das erste gültige Signal zählt.':'Ohne Antworttaster: Die erste klar erkennbare Meldung zählt.'):'Alle Teams machen gleichzeitig mit.'}</div></div>`;let mid=`<div class="host-col">${hostQuestion(ch)}`;let right=`<div class="host-col">`;
if(g.phase==='wagers'){mid+=`<div class="question-host">Trage den geheimen Einsatz jedes Teams ein, bevor die letzte Frage gezeigt wird.</div>${wagerInputs()}</div>`;right+=hostTeams()+`<button class="btn primary" style="width:100%" data-action="saveWagers">WETTEN FESTLEGEN & FRAGE ZEIGEN →</button>`;}
else if(r===3&&g.phase!=='resolved'){mid+=`<div class="host-message"><b>${g.quick.attempts===0?'ERSTER VERSUCH':'ZWEITER UND LETZTER VERSUCH'}</b><br>${state.equipment.buzzers?'Gültiges erstes Tastersignal auswählen.':'Erste klar erkennbare Meldung auswählen.'}</div></div>`;right+=state.teams.map(t=>{const tried=g.quick.attemptedTeamIds?.includes(t.id),selected=g.quick.selectedTeam===t.id;return `<div class="team-control ${selected?'pending':''} ${tried?'team-tried':''}"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div><div class="team-actions">${selected?`<button class="btn success" data-action="quickCorrect">RICHTIG +100</button><button class="btn wrong" data-action="quickWrong">FALSCH −50</button>`:`<button class="btn" data-action="selectQuick" data-id="${t.id}" ${(g.quick.attempts>=2||tried)?'disabled':''}>${tried?'BEREITS VERSUCHT':'TEAM WÄHLEN'}</button>`}</div></div>`}).join('');}
else if(g.phase==='finalQuestion'){mid+=`</div>`;right+=pendingTeamButtons()+`<div class="host-message compact-hint">Vor dem Auswerten jedes Team als richtig oder falsch markieren.</div><button class="btn primary" style="width:100%;margin-top:10px" data-action="applyFinal">FINALE AUSWERTEN</button>`;}
else if(g.phase==='resolved'){mid+=`</div>`;right+=hostTeams()+`<button class="btn primary" style="width:100%;margin-top:10px" data-action="nextRS">${r===4?'SPIEL BEENDEN':'WEITER →'}</button>`;}
else{if(ch.type==='estimation'){mid+=`<div class="host-label">SCHÄTZUNGEN DER TEAMS</div>${estimateInputs()}</div>`;right+=hostTeams()+`<button class="btn primary" style="width:100%" data-action="applySim">BERECHNEN & ÜBERNEHMEN</button>`;}else{mid+=`</div>`;right+=correctOnlyTeamButtons(ch.points)+`<button class="btn primary" style="width:100%;margin-top:10px" data-action="applySim">ERGEBNIS ÜBERNEHMEN</button>`;}}
right+=scoreHistory()+`</div>`;return left+mid+right;}
function hostQuestion(ch){if(!ch)return '<div>Keine Aufgabe geladen.</div>';return `<div class="host-label">FRAGE</div><div class="question-host">${esc(ch.prompt)}</div>${ch.media?.type==='audio'?'<button class="btn" data-action="audio">TON ABSPIELEN</button>':''}${ch.media?.type==='image'?`<img src="${ch.media.src}" alt="" style="max-width:100%;max-height:220px;border:1px solid var(--border);margin-bottom:14px">`:''}${ch.clues?`<div class="host-message">Hinweise: ${ch.clues.map(esc).join(' · ')}</div>`:''}${ch.items?`<div class="host-message">Elemente: ${ch.items.map(esc).join(' · ')}</div>`:''}<div class="answer-box ${state.game?.answerRevealed?'answer-revealed':''}"><div class="host-label">ANTWORT ${state.game?.answerRevealed?'· AM BEAMER SICHTBAR':'· NUR SPIELLEITUNG'}</div><div class="answer">${esc(ch.answer)}</div>${ch.explanation?`<div class="host-note">${esc(ch.explanation)}</div>`:''}</div>`;}
function pendingTeamButtons(){return state.teams.map(t=>{const p=state.game.pending?.[t.id];return `<div class="team-control ${p==='correct'?'resolved-good':p==='wrong'?'resolved-bad':''}"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div><div class="team-actions"><button class="btn success" data-action="pending" data-id="${t.id}" data-value="correct">RICHTIG</button><button class="btn wrong" data-action="pending" data-id="${t.id}" data-value="wrong">FALSCH</button></div></div>`}).join('');}
function correctOnlyTeamButtons(points){return `<div class="host-message compact-hint">Nur richtige Teams markieren. Nicht markiert = 0 Punkte.</div>`+state.teams.map(t=>{const p=state.game.pending?.[t.id];return `<div class="team-control ${p==='correct'?'resolved-good':''}"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div><div class="team-actions"><button class="btn ${p==='correct'?'success':''}" data-action="pending" data-id="${t.id}" data-value="correct">${p==='correct'?'✓ RICHTIG':'RICHTIG'} ${points?`+${points}`:''}</button></div></div>`}).join('');}
function wagerInputs(){return `<div class="wager-grid">${state.teams.map(t=>`<label class="wager-row"><span class="stripe" style="height:38px;background:${teamColor(t)}"></span><b>${esc(t.name)}</b><select data-change="wager" data-input="wager" data-id="${t.id}">${[0,100,200,300,400,500].map(v=>`<option value="${v}" ${Number(state.game.wagers[t.id]||0)===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}</div>`;}
function estimateInputs(){return state.teams.map(t=>`<label class="estimate-row"><span class="stripe" style="height:38px;background:${teamColor(t)}"></span><b>${esc(t.name)}</b><input type="number" data-input="estimate" data-id="${t.id}" value="${esc(state.game.estimates?.[t.id]??'')}"></label>`).join('');}
function hostClassic(){const g=state.game,ch=currentChallenge();if(g.stage==='board')return hostClassicBoard();if(g.stage==='finalWagers')return `<div class="host-col"><div class="host-label">FINALE</div><h2 class="host-title">Finalwette</h2></div><div class="host-col"><div class="question-host">Kategorie: WELT</div>${wagerInputs()}</div><div class="host-col">${hostTeams()}<button class="btn primary" style="width:100%" data-action="classicSaveWagers">WETTEN FESTLEGEN & FRAGE ZEIGEN →</button></div>`;if(g.stage==='finalQuestion')return `<div class="host-col"><div class="host-label">FINALWETTE</div>${timerHost()}</div><div class="host-col">${hostQuestion(g.finalChallenge)}</div><div class="host-col">${pendingTeamButtons()}<div class="host-message compact-hint">Vor dem Auswerten jedes Team als richtig oder falsch markieren.</div><button class="btn primary" style="width:100%" data-action="classicApplyFinal">FINALE AUSWERTEN</button></div>`;if(g.stage==='finalResolved')return `<div class="host-col"><div class="host-label">FINALE BEENDET</div></div><div class="host-col">${hostQuestion(g.finalChallenge)}</div><div class="host-col">${hostTeams()}<button class="btn primary" style="width:100%" data-action="finish">ERGEBNIS ZEIGEN →</button></div>`;let selector=state.teams[g.selectorIndex];let left=`<div class="host-col"><div class="host-label">QUIZTAFEL</div><h2 class="host-title">${esc(selector.name)} wählt</h2>${timerHost()}<div class="host-message">Gespielt: ${g.used.length} / ${g.tiles.length}</div></div>`;let mid=`<div class="host-col">${hostQuestion(ch)}`;let right=`<div class="host-col">`;
if(g.stage==='riskChoice'){mid+=`<div class="host-message"><b>RISIKOFELD</b><br>Vor dem Anzeigen der Frage entscheiden.</div><button class="btn" data-action="riskMode" data-value="safe">SICHER · +${ch.points} / 0</button> <button class="btn primary" data-action="riskMode" data-value="risk">RISIKO · +${ch.points*2} / −${ch.points}</button></div>`;right+=hostTeams();}
else if(g.stage==='question'){mid+=`</div>`;right+=`<div class="host-label">ANTWORTET JETZT</div><div class="team-control pending active-answer-team"><div class="team-head"><div class="stripe" style="background:${teamColor(selector)}"></div><div class="team-name">${esc(selector.name)}</div><div class="team-score">${selector.score}</div></div><div class="team-actions primary-team-actions"><button class="btn success" data-action="classicCorrect" data-id="${selector.id}">RICHTIG +${g.riskMode==='risk'?ch.points*2:ch.points}</button><button class="btn wrong" data-action="classicWrong" data-id="${selector.id}">FALSCH ${g.riskMode==='risk'?'−'+ch.points:g.riskMode==='safe'?'0':'→ KLAU'}</button></div></div><div class="host-label secondary-team-label">PUNKTESTAND</div>${hostTeams()}`;}
else if(g.stage==='steal'){mid+=`<div class="host-message"><b>KLAUCHANCE OFFEN</b> · Ein anderes Team darf antworten.</div></div>`;right+=state.teams.filter(t=>t.id!==selector.id).map(t=>`<div class="team-control ${g.stealTeam===t.id?'pending':''}"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div><div class="team-actions">${g.stealTeam===t.id?`<button class="btn success" data-action="stealCorrect">RICHTIG +${ch.points}</button><button class="btn wrong" data-action="stealWrong">FALSCH · AUFLÖSEN</button>`:`<button class="btn" data-action="selectSteal" data-id="${t.id}">TEAM WÄHLEN</button>`}</div></div>`).join('')+`<button class="btn" style="width:100%" data-action="classicResolveNoSteal">KEIN VERSUCH / AUFLÖSEN</button>`;}
else if(g.stage==='resolved'){mid+=`</div>`;const done=g.used.length===g.tiles.length;right+=hostTeams()+`<button class="btn primary" style="width:100%;margin-top:10px" data-action="${done?'classicFinal':'classicBoard'}">${done?(g.finalEnabled?'FINALWETTE →':'ERGEBNIS ZEIGEN →'):'ZURÜCK ZUR TAFEL →'}</button>`;}
right+=scoreHistory()+`</div>`;return left+mid+right;}
function hostClassicBoard(){const g=state.game,selector=state.teams[g.selectorIndex];return `<div class="host-col"><div class="host-label">QUIZTAFEL</div><h2 class="host-title">${esc(selector.name)}</h2><div class="host-message">Das Wahlteam wählt auf der Beameransicht eine Kategorie und einen Punktwert.</div></div><div class="host-col"><div class="host-label">FELD WÄHLEN</div>${miniBoardHost()}</div><div class="host-col">${hostTeams()}${g.used.length===g.tiles.length?`<button class="btn primary" style="width:100%" data-action="classicFinal">${g.finalEnabled?'FINALWETTE STARTEN':'ERGEBNIS ZEIGEN'}</button>`:''}${scoreHistory()}</div>`;}
function miniBoardHost(){const g=state.game;return `<div class="board" style="grid-template-columns:repeat(${g.categories.length},1fr)">${g.categories.map(c=>`<div class="board-cat ${catSizeClass(c)}">${esc(c)}</div>`).join('')}${Array.from({length:g.rows},(_,r)=>g.categories.map(c=>{const q=CB.find(x=>x.cat===c&&x.row===r),used=g.used.includes(q.id);return `<button class="tile ${used?'used':''}" style="height:62px;font-size:31px" data-action="openTile" data-id="${q.id}" ${used?'disabled':''}>${used?'—':q.points}</button>`}).join('')).join('')}</div>`;}
function hostBottom(){const canUndo=!!state.undoStack?.length;const correction=`<button class="btn" data-action="scoreEditor">PUNKTE KORRIGIEREN</button>`;const undoBtn=`<button class="btn" data-action="undo" ${canUndo?'':'disabled'}>RÜCKGÄNGIG <span class="key">U</span></button>`;if(['rules','roundIntro','between','results'].includes(state.screen))return `<footer class="host-bottom">${undoBtn}${correction}<span class="push muted">Automatisch gespeichert · Änderungen sind rückgängig machbar.</span></footer>`;const revealAllowed=!!state.game&&!state.game.answerRevealed&&state.screen!=='tiebreaker';return `<footer class="host-bottom">${undoBtn}${correction}${revealAllowed?`<button class="btn" data-action="reveal">ANTWORT ZEIGEN <span class="key">R</span></button>`:''}<button class="btn" data-action="pauseGame">${state.paused?'FORTSETZEN':'SPIEL PAUSIEREN'}</button><span class="push muted">Leertaste: Zeit · R: Antwort · U: Rückgängig</span></footer>`;}

function nameSizeClass(name){const n=String(name||'').length;return n>19?'name-xs':n>14?'name-sm':'';}
function catSizeClass(name){const n=String(name||'').length;return n>26?'cat-xs':n>18?'cat-sm':'';}
function questionSizeClass(text){const n=String(text||'').length;return n>190?'q-xlong':n>125?'q-long':n<70?'q-short':'';}
function scoreRail(){const cols=Math.min(5,state.teams.length);return `<div class="score-rail teams-${cols}" style="grid-template-columns:repeat(${cols},1fr)">${state.teams.map(t=>`<div class="score-cell"><div class="stripe" style="background:${teamColor(t)}"></div><div class="score-name ${nameSizeClass(t.name)}" title="${esc(t.name)}">${esc(t.name)}</div><div class="score-num">${t.score}</div></div>`).join('')}</div>`;}
function displayShell(main,topLeft='',topRight='',timer=false){return `<div class="display"><button class="btn small fullscreen-hint" data-action="fullscreen">VOLLBILD</button><div class="display-top"><div>${topLeft}</div><div>${topRight}</div></div><main class="display-main">${main}</main>${timer?`<div class="display-timer mono ${timerClass()}" data-timer>${state.timer.status==='expired'?'ZEIT':fmtTime(currentTimerRemaining())}</div>`:''}${scoreRail()}</div>`;}
function renderDisplay(){if(!state){app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">WARTE AUF DIE SPIELLEITUNG</h1><p class="display-sub">Diese Ansicht wird über die Spielleitung geöffnet.</p></main></div>`);return;}if(state.paused){app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">PAUSE</h1><p class="display-sub">Das Spiel geht gleich weiter.</p></main>${scoreRail()}</div>`);return;}if(state.screen==='rules'){renderDisplayRules();return;}if(state.screen==='practice'){renderDisplayPractice();return;}if(state.screen==='roundIntro'){renderDisplayRoundIntro();return;}if(state.screen==='between'){renderDisplayBetween();return;}if(state.screen==='results'){renderDisplayResults();return;}if(state.screen==='tiebreaker'){renderDisplayTiebreaker();return;}if(state.screen==='playing'){if(state.game.type==='roundshow')renderDisplayRS();else renderDisplayClassic();return;}app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">GLEICH GEHT’S LOS</h1></main>${scoreRail()}</div>`);}
function renderDisplayRules(){const rs=state.game.type==='roundshow';const title=rs?'RUNDENQUIZ':'QUIZTAFEL';const rules=rs?[['01','FÜNF VERSCHIEDENE RUNDEN'],['02','BERATET EUCH IM TEAM'],['03','MANCHE RUNDEN LAUFEN GLEICHZEITIG'],['04','DIE MEISTEN PUNKTE GEWINNEN']]:[['01','KATEGORIE WÄHLEN'],['02','EUER TEAM ANTWORTET ZUERST'],['03','FALSCH? EIN TEAM DARF KLAUEN'],['04','DIE MEISTEN PUNKTE GEWINNEN']];app(`<div class="display"><button class="btn small fullscreen-hint" data-action="fullscreen">VOLLBILD</button><div class="display-top"><div>LIGO / QUIZABEND</div><div>SO FUNKTIONIERT’S</div></div><main class="display-main"><div class="display-kicker">${title}</div><h1 class="display-title" style="font-size:92px">SO FUNKTIONIERT’S</h1><div class="rules-grid">${rules.map(([n,t])=>`<div class="rule-item"><div class="rule-num">${n}</div><div class="rule-text">${t}</div></div>`).join('')}</div></main>${scoreRail()}</div>`);}
function renderDisplayPractice(){const ch=currentChallenge();app(displayShell(challengeDisplay(ch,state.game.answerRevealed), 'PROBERUNDE · KEINE PUNKTE','',true));}
function renderDisplayRoundIntro(){let title,sub;if(state.game.type==='roundshow'){const r=state.game.roundIndex;title=ROUND_NAMES[r];const counts=state.game.rounds[r].length;sub=r===4?'EINE LETZTE AUFGABE':`${counts} AUFGABEN`;}else{title='QUIZTAFEL';sub=`${state.game.categories.length} KATEGORIEN · ${state.game.rows} STUFEN`;}app(`<div class="display"><button class="btn small fullscreen-hint" data-action="fullscreen">VOLLBILD</button><div class="display-top"><div>LIGO / QUIZABEND</div><div>${state.game.type==='roundshow'?'RUNDE '+(state.game.roundIndex+1):'SPIEL'}</div></div><main class="display-main"><div class="display-kicker">${sub}</div><h1 class="display-title">${title}</h1></main>${scoreRail()}</div>`);}

function newSessionTemplate(id){return {schemaVersion:SCHEMA,id,createdAt:now(),updatedAt:now(),status:'setup',screen:'teams',teams:[],equipment:{buzzers:false,whiteboards:false,paperPens:true},selectedGame:'roundshow',config:{roundshow:{preset:'standard',timers:{everybody:30,media:25,think:45,quickfire:15,final:60}},classic:{board:'standard',customCats:5,customRows:5,categoryCount:5,profile:'ligo',selectedCategories:CLASSIC_PROFILES.ligo.slice(0,5),pointScale:'classic',mainTimer:25,stealTimer:8,stealMode:'single',selectorRule:'fixed',riskTiles:1,doubleTiles:1,allPlayTiles:1,finalMode:'wager'}},game:null,timer:{status:'idle',durationMs:30000,baseDurationMs:30000,startedAt:null,pausedRemainingMs:null},paused:false,pauseTimerWasRunning:false,undoStack:[],scoreHistory:[]};}

function classicDimensions(c){if(c.board==='short')return {cats:4,rows:4};if(c.board==='large')return {cats:6,rows:5};if(c.board==='custom')return {cats:Math.max(3,Math.min(6,Number(c.customCats)||5)),rows:Math.max(3,Math.min(5,Number(c.customRows)||5))};return {cats:5,rows:5};}
function classicPointValues(c,rows){const step=c.pointScale==='compact'?50:c.pointScale==='high'?200:100;return Array.from({length:rows},(_,i)=>step*(i+1));}
function classicProfileList(profile){return CLASSIC_PROFILES[profile]||CLASSIC_ALL_CATS;}
function ensureClassicSelection(c){const d=classicDimensions(c);c.categoryCount=d.cats;let selected=Array.isArray(c.selectedCategories)?c.selectedCategories.filter(x=>CLASSIC_ALL_CATS.includes(x)):[];if(c.profile!=='custom')selected=classicProfileList(c.profile).slice(0,d.cats);else selected=selected.slice(0,d.cats);c.selectedCategories=selected;return c;}
function classicDuration(c){const d=classicDimensions(c),tiles=d.cats*d.rows;let per=1.45+(state?.teams?.length||4)*.08;if(c.stealMode==='relay')per+=.35;if(c.stealMode==='none')per-=.12;const specials=(Number(c.allPlayTiles)||0)*.45+(Number(c.riskTiles)||0)*.18;const final=c.finalMode==='none'?0:5;const mid=Math.max(18,tiles*per+specials+final);return {lo:Math.max(20,Math.round(mid*.84)),hi:Math.round(mid*1.18)};}
function classicFinalChallenge(c){const key=c.profile==='bible'?'bible':c.profile==='general'?'general':c.profile==='ligo'?'ligo':'custom';return clone(CLASSIC_FINALS[key]);}
function classicSpecialCounts(c,tiles){const max=Math.max(0,Math.min(7,tiles-3));let r=Math.max(0,Math.min(3,Number(c.riskTiles)||0)),d=Math.max(0,Math.min(3,Number(c.doubleTiles)||0)),a=Math.max(0,Math.min(2,Number(c.allPlayTiles)||0));while(r+d+a>max){if(a)a--;else if(d)d--;else r--;}return {risk:r,double:d,allplay:a};}
function assignClassicSpecials(tiles,c){const counts=classicSpecialCounts(c,tiles.length),out={};const used=new Set();const fractions=[.28,.63,.82,.46,.72,.37,.91,.55];let k=0;function take(type,n){for(let j=0;j<n;j++){let idx=Math.min(tiles.length-1,Math.max(1,Math.round((tiles.length-1)*fractions[k++%fractions.length])));while(used.has(idx)&&idx<tiles.length-1)idx++;while(used.has(idx)&&idx>0)idx--;if(!used.has(idx)){used.add(idx);out[tiles[idx]]=type;}}}take('risk',counts.risk);take('double',counts.double);take('allplay',counts.allplay);return out;}
function classicQuestionById(id){const q=CB2.find(x=>x.id===id);if(!q)return null;const copy={...q,category:q.cat};if(state?.game?.type==='classic'){copy.points=state.game.pointValues?.[q.row]??((q.row+1)*100);}return copy;}
function currentChallenge(){if(!state?.game)return null;if(state.game.type==='roundshow'){if(state.game.practice)return PRACTICE.roundshow;const r=state.game.roundIndex;if(r===4)return RS.find(x=>x.round===4);const list=state.game.rounds[r]||[];return list[state.game.itemIndex]||null;}if(state.game.type==='classic'){if(state.game.practice)return PRACTICE.classic;if(state.game.currentTileId)return classicQuestionById(state.game.currentTileId);return state.game.finalChallenge||null;}return null;}
function classicSpecialType(){return state.game?.specialById?.[state.game.currentTileId]||null;}
function classicCurrentValue(){const ch=currentChallenge();if(!ch)return 0;if(classicSpecialType()==='double')return ch.points*2;if(state.game.riskMode==='risk')return ch.points*2;return ch.points;}
function classicSpecialLabel(type){return type==='risk'?'RISIKOFELD':type==='double'?'DOPPELWERT':type==='allplay'?'ALLE SPIELEN':'';}

function buildClassic(){resetScores();const cfg=ensureClassicSelection(state.config.classic);const d=classicDimensions(cfg);if(cfg.selectedCategories.length!==d.cats){toast(`Bitte genau ${d.cats} Kategorien auswählen`);return;}const useCats=[...cfg.selectedCategories];const rows=d.rows;const pointValues=classicPointValues(cfg,rows);const tiles=[];for(let r=0;r<rows;r++)for(const cat of useCats){const q=CB2.find(x=>x.cat===cat&&x.row===r);if(q)tiles.push(q.id);}if(tiles.length!==useCats.length*rows){toast('Für diese Auswahl fehlen Fragen. Bitte andere Kategorien wählen.');return;}const specialById=assignClassicSpecials(tiles,cfg);state.status='ready';state.game={type:'classic',categories:useCats,rows,pointValues,tiles,used:[],specialById,selectorIndex:0,currentTileId:null,stage:'board',riskMode:null,stealTeam:null,stealAttemptedIds:[],lastCorrectTeamId:null,practice:false,answerRevealed:false,finalMode:cfg.finalMode,finalStage:null,wagers:{},pending:{},finalChallenge:classicFinalChallenge(cfg)};state.screen='rules';resetTimer(cfg.mainTimer);persist();render();}

function openTile(id){if(state.game.used.includes(id))return;const q=classicQuestionById(id);if(!q)return;setState(s=>{const g=s.game;g.currentTileId=id;g.answerRevealed=false;g.stealTeam=null;g.stealAttemptedIds=[];g.riskMode=null;g.lastCorrectTeamId=null;const special=g.specialById?.[id];if(special==='risk')g.stage='riskChoice';else if(special==='allplay'){g.stage='allPlay';g.pending={};resetTimer(s.config.classic.mainTimer);}else{g.stage='question';resetTimer(s.config.classic.mainTimer);}});}
function classicCorrect(teamId){const ch=currentChallenge();const delta=classicCurrentValue();score(teamId,delta,'correct',ch.id);state.game.lastCorrectTeamId=teamId;persist();resolveClassic(false);}
function classicWrong(teamId){const g=state.game,ch=currentChallenge(),cfg=state.config.classic;if(g.riskMode==='risk'){score(teamId,-ch.points,'risk',ch.id);g.lastCorrectTeamId=null;persist();resolveClassic(false);return;}if(g.riskMode==='safe'||cfg.stealMode==='none'){g.lastCorrectTeamId=null;resolveClassic(true);return;}setState(s=>{s.game.stage='steal';s.game.stealTeam=null;s.game.stealAttemptedIds=[];s.game.lastCorrectTeamId=null;resetTimer(s.config.classic.stealTimer);},{undo:true});}
function selectSteal(id){const g=state.game,selector=state.teams[g.selectorIndex];if(id===selector.id||g.stealAttemptedIds?.includes(id))return;setState(s=>{s.game.stealTeam=id;});}
function stealResult(correct){const g=state.game,ch=currentChallenge(),id=g.stealTeam,cfg=state.config.classic;if(!id){toast('Zuerst das Team für die Klauchance auswählen');return;}if(correct){score(id,classicCurrentValue(),'steal',ch.id);state.game.lastCorrectTeamId=id;persist();resolveClassic(false);return;}if(cfg.stealMode==='relay'){setState(s=>{if(!s.game.stealAttemptedIds.includes(id))s.game.stealAttemptedIds.push(id);s.game.stealTeam=null;const selector=s.teams[s.game.selectorIndex];const remaining=s.teams.filter(t=>t.id!==selector.id&&!s.game.stealAttemptedIds.includes(t.id));if(!remaining.length){if(!s.game.used.includes(s.game.currentTileId))s.game.used.push(s.game.currentTileId);s.game.answerRevealed=true;s.game.stage='resolved';}else resetTimer(s.config.classic.stealTimer);},{undo:true});return;}resolveClassic(true);}
function applySimultaneous(){if(state.game?.type==='classic'&&state.game.stage==='allPlay'){const ch=currentChallenge();pushUndo();for(const t of state.teams){if(state.game.pending?.[t.id]==='correct'){t.score+=ch.points;state.scoreHistory.push({teamId:t.id,delta:ch.points,source:'correct',challengeId:ch.id,timestamp:now()});}}if(!state.game.used.includes(state.game.currentTileId))state.game.used.push(state.game.currentTileId);state.game.answerRevealed=true;state.game.stage='resolved';state.game.lastCorrectTeamId=null;persist();render();sound('correct');return;}const ch=currentChallenge();if(!ch)return;if(ch.type==='estimation'){applyEstimation();return;}pushUndo();for(const t of state.teams){if(state.game.pending[t.id]==='correct'){t.score+=ch.points;state.scoreHistory.push({teamId:t.id,delta:ch.points,source:'correct',challengeId:ch.id,timestamp:now()});}}state.game.phase='resolved';state.game.answerRevealed=true;persist();render();sound('correct');}
function backToBoard(){setState(s=>{const g=s.game,cfg=s.config.classic;if(cfg.selectorRule==='correct'&&g.lastCorrectTeamId){const idx=s.teams.findIndex(t=>t.id===g.lastCorrectTeamId);g.selectorIndex=idx>=0?idx:(g.selectorIndex+1)%s.teams.length;}else g.selectorIndex=(g.selectorIndex+1)%s.teams.length;g.currentTileId=null;g.stage='board';g.riskMode=null;g.stealTeam=null;g.stealAttemptedIds=[];g.lastCorrectTeamId=null;g.answerRevealed=false;g.pending={};resetTimer(s.config.classic.mainTimer);},{undo:true});}
function maybeClassicFinal(){const g=state.game;if(g.used.length<g.tiles.length)return false;if(g.finalMode==='wager'){setState(s=>{s.game.stage='finalWagers';s.game.currentTileId=null;s.game.wagers={};s.game.pending={};});return true;}if(g.finalMode==='fixed'){setState(s=>{s.game.stage='finalQuestion';s.game.currentTileId=null;s.game.pending={};s.game.wagers={};resetTimer(60);});return true;}finishGame();return true;}
function classicWagerOptions(){if(state.game?.type!=='classic')return [0,100,200,300,400,500];return [0,...(state.game.pointValues||[100,200,300,400,500])];}
function wagerInputs(){const opts=state.game?.type==='classic'?classicWagerOptions():[0,100,200,300,400,500];return `<div class="wager-grid">${state.teams.map(t=>`<label class="wager-row"><span class="stripe" style="height:38px;background:${teamColor(t)}"></span><b>${esc(t.name)}</b><select data-change="wager" data-input="wager" data-id="${t.id}">${opts.map(v=>`<option value="${v}" ${Number(state.game.wagers[t.id]||0)===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}</div>`;}
function classicSaveWagers(){const allowed=classicWagerOptions();for(const t of state.teams){const v=Number(state.game.wagers[t.id]??0);if(!allowed.includes(v)){toast('Bitte einen angebotenen Einsatz auswählen');return;}}setState(s=>{s.game.stage='finalQuestion';s.game.pending={};resetTimer(60);});}
function classicApplyFinal(){if(!state.teams.every(t=>['correct','wrong'].includes(state.game.pending?.[t.id]))){toast('Bitte jedes Team als richtig oder falsch markieren');return;}pushUndo();const fixedValue=(state.game.pointValues?.at(-1)||500)*2;for(const t of state.teams){const res=state.game.pending[t.id];let delta=0;if(state.game.finalMode==='wager'){const w=Number(state.game.wagers[t.id]||0);delta=res==='correct'?w:-w;}else delta=res==='correct'?fixedValue:0;t.score+=delta;if(delta)state.scoreHistory.push({teamId:t.id,delta,source:'wager',challengeId:state.game.finalChallenge.id,timestamp:now()});}state.game.stage='finalResolved';state.game.answerRevealed=true;persist();render();sound('round');}

onfig-inline"><b>Inhaltsprofil</b><select data-change="classicProfile">${profileOptions.map(([v,l])=>`<option value="${v}" ${c.profile===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="category-grid">${cats}</div><div class="config-note">Wähle genau so viele Kategorien, wie die Tafel Spalten hat. Eine manuelle Änderung wechselt automatisch zu „Eigene Auswahl“.</div></section><section class="config-block"><div class="summary-label">PUNKTE & SPIELFLUSS</div><div class="config-inline"><b>Punkteskala</b><select data-change="classicPointScale">${Object.entries(CLASSIC_POINT_LABELS).map(([v,l])=>`<option value="${v}" ${c.pointScale===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="config-inline"><b>Antwortzeit</b>${timeSelect(c.mainTimer,'mainTimer',true)}</div><div class="config-inline"><b>Klauen</b><select data-change="classicStealMode"><option value="none" ${c.stealMode==='none'?'selected':''}>Aus</option><option value="single" ${c.stealMode==='single'?'selected':''}>Eine offene Klauchance</option><option value="relay" ${c.stealMode==='relay'?'selected':''}>Mehrere Klauversuche</option></select></div>${c.stealMode!=='none'?`<div class="config-inline"><b>Klauzeit</b>${timeSelect(c.stealTimer,'stealTimer',true)}</div>`:''}<div class="config-inline"><b>Wer wählt danach?</b><select data-change="classicSelectorRule"><option value="fixed" ${c.selectorRule==='fixed'?'selected':''}>Feste Team-Reihenfolge</option><option value="correct" ${c.selectorRule==='correct'?'selected':''}>Team mit richtiger Antwort</option></select></div></section><section class="config-block"><div class="summary-label">VERSTECKTE SONDERFELDER</div><div class="special-grid"><div class="special-card"><b>Risiko</b><p>Sicher spielen oder doppelte Punkte mit möglichem Verlust riskieren.</p><select data-change="classicSpecial" data-id="riskTiles">${[0,1,2,3].map(v=>`<option value="${v}" ${Number(c.riskTiles)===v?'selected':''}>${v}</option>`).join('')}</select></div> l">Sonderfelder</div><div class="summary-value">${Number(c.riskTiles)+Number(c.doubleTiles)+Number(c.allPlayTiles)} versteckt</div></div></aside></div><div class="wizard-actions"><button class="btn" data-action="backGame">← ZURÜCK</button><button class="btn primary big" data-action="launch">BEREIT →</button></div>`;}

function handleChange(e){const key=e.currentTarget.dataset.change,val=e.currentTarget.value,id=e.currentTarget.dataset.id;if(key==='teamColor')setState(s=>{const t=s.teams.find(x=>x.id===id);if(t)t.color=val;});if(key==='rsTimer')setState(s=>s.config.roundshow.timers[id]=Number(val));if(key==='classicTimer')setState(s=>s.config.classic[id]=val==='off'?0:Number(val));if(key==='wager')setState(s=>s.game.wagers[id]=Number(val));if(key==='classicProfile')setState(s=>{s.config.classic.profile=val;ensureClassicSelection(s.config.classic);});if(key==='classicPointScale')setState(s=>s.config.classic.pointScale=val);if(key==='classicStealMode')setState(s=>s.config.classic.stealMode=val);if(key==='classicSelectorRule')setState(s=>s.config.classic.selectorRule=val);if(key==='classicFinalMode')setState(s=>s.config.classic.finalMode=val);if(key==='classicCustomCats')setState(s=>{s.config.classic.customCats=Number(val);s.config.classic.board='custom';ensureClassicSelection(s.config.classic);});if(key==='classicCustomRows')setState(s=>{s.config.classic.customRows=Number(val);s.config.classic.board='custom';ensureClassicSelection(s.config.classic);});if(key==='classicSpecial')setState(s=>s.config.classic[id]=Number(val));if(key==='classicCategory'){const c=state.config.classic,d=classicDimensions(c),arr=Array.isArray(c.selectedCategories)?[...c.selectedCategories]:[];if(e.currentTarget.checked&&!arr.includes(id)&&arr.length>=d.cats){e.currentTarget.checked=false;toast(`Maximal ${d.cats} Kategorien auswählen – zuerst eine andere abwählen`);return;}setState(s=>{const cc=s.config.classic;cc.profile='custom';let next=Array.isArray(cc.selectedCategories)?[...cc.selectedCategories]:[];if(e.currentTarget.checked){if(!next.includes(id))next.push(id);}else next=next.filter(x=>x!==id);cc.selectedCategories=next;});}}
