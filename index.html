function renderDisplayRoundIntro(){let title,sub;if(state.game.type==='roundshow'){const r=state.game.roundIndex;title=ROUND_NAMES[r];const counts=state.game.rounds[r].length;sub=r===4?'EINE LETZTE AUFGABE':`${counts} AUFGABEN`;}else{title='QUIZTAFEL';sub=`${state.game.categories.length} KATEGORIEN · ${state.game.rows} STUFEN · ${state.game.tiles.length} FELDER`;}app(`<div class="display"><button class="btn small fullscreen-hint" data-action="fullscreen">VOLLBILD</button><div class="display-top"><div>LIGO / QUIZABEND</div><div>${state.game.type==='roundshow'?'RUNDE '+(state.game.roundIndex+1):'SPIEL'}</div></div><main class="display-main"><div class="display-kicker">${sub}</div><h1 class="display-title">${title}</h1></main>${scoreRail()}</div>`);}

function hostClassic(){const g=state.game,ch=currentChallenge(),c=state.config.classic;if(g.stage==='board')return hostClassicBoard();const finalValue=(g.pointValues?.at(-1)||500)*2;if(g.stage==='finalWagers')return `<div class="host-col"><div class="host-label">FINALE</div><h2 class="host-title">Finalwette</h2></div><div class="host-col"><div class="question-host">Kategorie: ${esc(g.finalChallenge.category)}</div>${wagerInputs()}</div><div class="host-col">${hostTeams()}<button class="btn primary" style="width:100%" data-action="classicSaveWagers">WETTEN FESTLEGEN & FRAGE ZEIGEN →</button></div>`;if(g.stage==='finalQuestion')return `<div class="host-col"><div class="host-label">${g.finalMode==='wager'?'FINALWETTE':'FINALFRAGE'}</div>${timerHost()}</div><div class="host-col">${hostQuestion(g.finalChallenge)}</div><div class="host-col">${pendingTeamButtons()}<div class="host-message compact-hint">${g.finalMode==='wager'?'Richtig: Einsatz dazu · falsch: Einsatz abziehen.':`Jedes richtige Team erhält ${finalValue} Punkte.`}</div><button class="btn primary" style="width:100%" data-action="classicApplyFinal">FINALE AUSWERTEN</button></div>`;if(g.stage==='finalResolved')return `<div class="host-col"><div class="host-label">FINALE BEENDET</div></div><div class="host-col">${hostQuestion(g.finalChallenge)}</div><div class="host-col">${hostTeams()}<button class="btn primary" style="width:100%" data-action="finish">ERGEBNIS ZEIGEN →</button></div>`;const selector=state.teams[g.selectorIndex],special=classicSpecialType();let left=`<div class="host-col"><div class="host-label">QUIZTAFEL</div><h2 class="host-title">${esc(selector.name)} wählt</h2>${timerHost()}<div class="host-board-meta"><div><b>Gespielt</b>${g.used.length} / ${g.tiles.length}</div><div><b>Regel</b>${c.selectorRule==='correct'?'Richtig wählt':'Feste Reihenfolge'}</div></div></div>`;let mid=`<div class="host-col">${special&&g.stage!=='riskChoice'?`<div class="special-banner ${special}">${classicSpecialLabel(special)}</div>`:''}${hostQuestion(ch)}`;let right=`<div class="host-col">`;
if(g.stage==='riskChoice'){mid+=`<div class="host-message"><b>RISIKOFELD</b><br>Vor dem Anzeigen der Frage entscheiden.</div><button class="btn" data-action="riskMode" data-value="safe">SICHER · +${ch.points} / 0</button> <button class="btn primary" data-action="riskMode" data-value="risk">RISIKO · +${ch.points*2} / −${ch.points}</button></div>`;right+=hostTeams();}
else if(g.stage==='allPlay'){mid+=`<div class="host-message"><b>ALLE SPIELEN</b> · Alle Teams beraten gleichzeitig.</div></div>`;right+=correctOnlyTeamButtons(ch.points)+`<button class="btn primary" style="width:100%" data-action="applySim">AUSWERTEN & AUFLÖSEN</button>`;}
else if(g.stage==='question'){mid+=`</div>`;const value=classicCurrentValue();right+=`<div class="host-label">ANTWORTET JETZT</div><div class="team-control pending active-answer-team"><div class="team-head"><div class="stripe" style="background:${teamColor(selector)}"></div><div class="team-name">${esc(selector.name)}</div><div class="team-score">${selector.score}</div></div><div class="team-actions primary-team-actions"><button class="btn success" data-action="classicCorrect" data-id="${selector.id}">RICHTIG +${value}</button><button class="btn wrong" data-action="classicWrong" data-id="${selector.id}">FALSCH ${g.riskMode==='risk'?'−'+ch.points:g.riskMode==='safe'||c.stealMode==='none'?'0':'→ KLAU'}</button></div></div><div class="host-label secondary-team-label">PUNKTESTAND</div>${hostTeams()}`;}
else if(g.stage==='steal'){const value=classicCurrentValue(),attempted=g.stealAttemptedIds||[];mid+=`<div class="host-message"><b>KLAUCHANCE OFFEN</b> · ${c.stealMode==='relay'?'Noch nicht versuchte Teams dürfen antworten.':'Ein anderes Team darf antworten.'}</div></div>`;right+=state.teams.filter(t=>t.id!==selector.id).map(t=>`<div class="team-control ${g.stealTeam===t.id?'pending':''} ${attempted.includes(t.id)?'team-tried':''}"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div><div class="team-actions">${attempted.includes(t.id)?`<span class="muted">VERSUCHT</span>`:g.stealTeam===t.id?`<button class="btn success" data-action="stealCorrect">RICHTIG +${value}</button><button class="btn wrong" data-action="stealWrong">FALSCH${c.stealMode==='relay'?' · WEITER':''}</button>`:`<button class="btn" data-action="selectSteal" data-id="${t.id}">TEAM WÄHLEN</button>`}</div></div>`).join('')+`<button class="btn" style="width:100%" data-action="classicResolveNoSteal">KEIN WEITERER VERSUCH / AUFLÖSEN</button>`;}
else if(g.stage==='resolved'){mid+=`</div>`;const done=g.used.length===g.tiles.length;right+=hostTeams()+`<button class="btn primary" style="width:100%;margin-top:10px" data-action="${done?'classicFinal':'classicBoard'}">${done?(g.finalMode==='wager'?'FINALWETTE →':g.finalMode==='fixed'?'FINALFRAGE →':'ERGEBNIS ZEIGEN →'):'ZURÜCK ZUR TAFEL →'}</button>`;}
right+=scoreHistory()+`</div>`;return left+mid+right;}
function hostClassicBoard(){const g=state.game,selector=state.teams[g.selectorIndex],dur=classicDuration(state.config.classic);return `<div class="host-col"><div class="host-label">QUIZTAFEL</div><h2 class="host-title">${esc(selector.name)}</h2><div class="host-message">Das Wahlteam wählt auf der Beameransicht eine Kategorie und einen Punktwert.</div><div class="host-board-meta"><div><b>Übrig</b>${g.tiles.length-g.used.length}</div><div><b>Restzeit grob</b>~${Math.max(1,Math.round((g.tiles.length-g.used.length)/(g.tiles.length)*dur.hi))} Min.</div></div></div><div class="host-col"><div class="host-label">FELD WÄHLEN</div>${miniBoardHost()}</div><div class="host-col">${hostTeams()}${g.used.length===g.tiles.length?`<button class="btn primary" style="width:100%" data-action="classicFinal">${g.finalMode==='wager'?'FINALWETTE STARTEN':g.finalMode==='fixed'?'FINALFRAGE STARTEN':'ERGEBNIS ZEIGEN'}</button>`:''}${scoreHistory()}</div>`;}
function miniBoardHost(){const g=state.game;return `<div class="board cols-${g.categories.length}" style="grid-template-columns:repeat(${g.categories.length},1fr)">${g.categories.map(c=>`<div class="board-cat ${catSizeClass(c)}">${esc(c)}</div>`).join('')}${Array.from({length:g.rows},(_,r)=>g.categories.map(c=>{const q=CB2.find(x=>x.cat===c&&x.row===r),used=q&&g.used.includes(q.id),pts=g.pointValues[r];return q?`<button class="tile ${used?'used':''}" style="height:62px;font-size:31px" data-action="openTile" data-id="${q.id}" ${used?'disabled':''}>${used?'—':pts}</button>`:''}).join('')).join('')}</div>`;}

function renderDisplayClassic(){const g=state.game,c=state.config.classic;if(g.stage==='board'){renderClassicBoardDisplay();return;}if(g.stage==='finalWagers'){const opts=classicWagerOptions();app(displayShell(`<div class="display-kicker">FINALWETTE · ${esc(g.finalChallenge.category)}</div><h1 class="display-title" style="font-size:105px">SETZT EURE PUNKTE</h1><p class="display-sub">${opts.join(' · ')}</p>`, 'QUIZTAFEL','FINALE',false));return;}if(g.stage==='finalQuestion'||g.stage==='finalResolved'){app(displayShell(challengeDisplay(g.finalChallenge,g.answerRevealed), g.finalMode==='wager'?'FINALWETTE':'FINALFRAGE','',g.stage==='finalQuestion'));return;}const ch=currentChallenge(),special=classicSpecialType();let status=`${esc(ch?.cat||ch?.category||'FRAGE')} / ${ch?.points||''}`;if(g.stage==='riskChoice'){app(displayShell(`<div class="display-kicker">RISIKOFELD</div><h1 class="display-title" style="font-size:104px">SICHER ODER RISIKO?</h1><p class="display-sub">Entscheidet euch, bevor ihr die Frage seht.</p>`, 'QUIZTAFEL',`${ch.points}-PUNKTE-FELD`,false));return;}if(g.stage==='allPlay')status=`ALLE SPIELEN · ${ch.points} PUNKTE`;else if(g.stage==='steal')status=c.stealMode==='relay'?'KLAUCHANCE · WEITERE TEAMS':'KLAUCHANCE OFFEN';else if(special==='double'&&g.stage==='question')status=`DOPPELWERT · ${classicCurrentValue()} PUNKTE`;else if(g.stage==='resolved')status='ANTWORT';app(displayShell(challengeDisplay({...ch,category:ch.cat},g.answerRevealed), 'QUIZTAFEL',status,['question','steal','allPlay'].includes(g.stage)));}
function renderClassicBoardDisplay(){const g=state.game,selector=state.teams[g.selectorIndex];let html=`<div class="display"><button class="btn small fullscreen-hint" data-action="fullscreen">VOLLBILD</button><div class="display-top"><div>QUIZTAFEL</div><div><span class="light-label">${esc(selector.name)}</span> WÄHLT</div></div><main class="display-main"><div class="board cols-${g.categories.length}" style="grid-template-columns:repeat(${g.categories.length},1fr)">${g.categories.map(c=>`<div class="board-cat ${catSizeClass(c)}">${esc(c)}</div>`).join('')}${Array.from({length:g.rows},(_,r)=>g.categories.map(c=>{const q=CB2.find(x=>x.cat===c&&x.row===r),used=q&&g.used.includes(q.id);return q?`<div class="tile ${used?'used':''}">${used?'—':g.pointValues[r]}</div>`:''}).join('')).join('')}</div></main>${scoreRail()}</div>`;app(html);}

const RS3_PROFILE_LABELS={ligo:'LiGo-Mischung',general:'Allgemein',bible:'Bibel-Fokus',neutral:'Neutral'};
const RS3_TYPES={
  alle:{label:'ALLE ANTWORTEN',short:'Alle antworten',mode:'sim',defaultCount:5,defaultTimer:30,defaultPoints:100,profiles:true,desc:'Alle Teams beraten gleichzeitig und zeigen ihre Antwort.'},

  verbindung:{label:'VERBINDUNGEN',short:'Verbindungen',mode:'sim',defaultCount:4,defaultTimer:45,defaultPoints:125,profiles:true,desc:'Gemeinsame Verbindung zwischen mehreren Hinweisen finden.'},
  reihenfolge:{label:'REIHENFOLGE',short:'Reihenfolge',mode:'sim',defaultCount:4,defaultTimer:45,defaultPoints:125,profiles:true,desc:'Ereignisse, Größen oder Schritte in die richtige Reihenfolge bringen.'},

  hinweise:{label:'HINWEISKETTE',short:'Hinweiskette',mode:'clue',defaultCount:4,defaultTimer:20,defaultPoints:150,profiles:true,desc:'Hinweise einzeln aufdecken; frühe richtige Antworten bringen mehr.'},
  final:{label:'RISIKOFINALE',short:'Risikofinale',mode:'final',defaultCount:1,defaultTimer:60,defaultPoints:0,profiles:true,desc:'Geheime Einsätze und eine gemeinsame letzte Frage.'}

const RS3_NORMAL_KINDS=['alle','bild','ton','schnell','verbindung','reihenfolge','schaetzen','logik','hoeher','hinweise'];
const RS3_ALL_KINDS=[...RS3_NORMAL_KINDS,'final'];
function rsCfgRound(kind,overrides={}){const m=RS3_TYPES[kind];return {id:uid(),kind,count:m.defaultCount,timer:m.defaultTimer,points:m.defaultPoints,profile:m.profiles?'ligo':'neutral',...overrides};}
function rsPreset(name){
  if(name==='short')return [rsCfgRound('alle',{count:4}),rsCfgRound('bild',{count:3}),rsCfgRound('logik',{count:3}),rsCfgRound('final')];
  if(name==='large')return [rsCfgRound('alle',{count:5}),rsCfgRound('bild',{count:4}),rsCfgRound('ton',{count:4}),rsCfgRound('verbindung',{count:4}),rsCfgRound('reihenfolge',{count:4}),rsCfgRound('schnell',{count:6}),rsCfgRound('final')];
  return [rsCfgRound('alle',{count:5}),rsCfgRound('bild',{count:4}),rsCfgRound('verbindung',{count:4}),rsCfgRound('schnell',{count:5}),rsCfgRound('final')];
}

function rsAvailableProfiles(kind){return RS3_TYPES[kind]?.profiles?['ligo','general','bible']:['neutral'];}
function rsMaxCount(kind,profile){return Math.max(1,rsFilterPool(kind,profile).length);}
function rsFilterPool(kind,profile){const pool=RS3_POOL.filter(q=>q.kind===kind);if(profile==='general')return pool.filter(q=>q.scope==='general'||q.scope==='neutral');if(profile==='bible')return pool.filter(q=>q.scope==='bible'||q.scope==='neutral');if(profile==='neutral')return pool.filter(q=>q.scope==='neutral');return pool;}
function rsSelectChallenges(round,usedIds=new Set()){
  let pool=rsFilterPool(round.kind,round.profile).filter(q=>!usedIds.has(q.id));
  if(round.profile==='ligo')pool.sort((a,b)=>{const av=a.scope==='bible'?1:0,bv=b.scope==='bible'?1:0;return av-bv;});

  if(pool.length<count)return null;

  }else chosen.push(...pool.slice(0,count));

function rsRoundMeta(){return state?.game?.type==='roundshow'?state.game.rounds[state.game.roundIndex]:null;}

function rsRoundMode(){const r=rsRoundMeta();return r?RS3_TYPES[r.kind]?.mode||'sim':'sim';}
function rsCurrentPoints(){const r=rsRoundMeta();if(!r)return 0;if(r.kind==='hinweise'){const idx=state.game.clueIndex||0;return Math.max(25,Number(r.points||150)-idx*25);}return Number(r.points||100);}

function ensureRSConfig(c){

function newSessionTemplate(id){return {schemaVersion:SCHEMA,id,createdAt:now(),updatedAt:now(),status:'setup',screen:'teams',teams:[],equipment:{buzzers:false,whiteboards:false,paperPens:true},selectedGame:'roundshow',config:{roundshow:{preset:'standard',rounds:rsPreset('standard')},classic:{board:'standard',customCats:5,customRows:5,categoryCount:5,profile:'ligo',selectedCategories:CLASSIC_PROFILES.ligo.slice(0,5),pointScale:'classic',mainTimer:25,stealTimer:8,stealMode:'single',selectorRule:'fixed',riskTiles:1,doubleTiles:1,allPlayTiles:1,finalMode:'wager'}},game:null,timer:{status:'idle',durationMs:30000,baseDurationMs:30000,startedAt:null,pausedRemainingMs:null},paused:false,pauseTimerWasRunning:false,undoStack:[],scoreHistory:[]};}
function normalizeSession(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))return null;if(Number(raw.schemaVersion)>SCHEMA)return null;const s=clone(raw);const defaults=newSessionTemplate(s.id||uid());mergeDefaults(s,defaults);s.schemaVersion=SCHEMA;if(!Array.isArray(s.teams)||s.teams.length<3||s.teams.length>5)return null;s.teams=s.teams.map((t,i)=>({id:String(t?.id||uid()),name:String(t?.name||('Team '+(i+1))).slice(0,24),color:TEAM_COLORS.includes(t?.color)?t.color:TEAM_COLORS[i%TEAM_COLORS.length],score:Number.isFinite(Number(t?.score))?Number(t.score):0,order:i}));if(!['setup','ready','playing','paused','results'].includes(s.status))s.status='setup';const screens=['teams','equipment','gameSelect','gameConfig','rules','practice','roundIntro','between','playing','results','tiebreaker'];if(!screens.includes(s.screen))s.screen='teams';if(s.game&&!['roundshow','classic'].includes(s.game.type))s.game=null;ensureRSConfig(s.config.roundshow);ensureClassicSelection(s.config.classic);if(s.game?.type==='roundshow'&&(!Array.isArray(s.game.rounds)||!s.game.rounds[0]?.kind)){s.game=null;s.screen='gameConfig';s.status='setup';s.selectedGame='roundshow';}if(s.game?.type==='classic'){s.game.used=Array.isArray(s.game.used)?s.game.used:[];s.game.riskIds=Array.isArray(s.game.riskIds)?s.game.riskIds:[];if(Array.isArray(s.game.tiles)&&s.game.tiles.some(id=>String(id).startsWith('cb-'))){s.game=null;s.screen='gameConfig';s.status='setup';s.selectedGame='classic';}}s.undoStack=Array.isArray(s.undoStack)?s.undoStack.slice(-100):[];s.scoreHistory=Array.isArray(s.scoreHistory)?s.scoreHistory:[];s.timer=mergeDefaults(s.timer||{},{status:'idle',durationMs:30000,baseDurationMs:Number(s.timer?.durationMs)||30000,startedAt:null,pausedRemainingMs:null});if(!['idle','running','paused','expired'].includes(s.timer.status))s.timer.status='idle';if(s.timer.status==='running'&&!Number.isFinite(Number(s.timer.startedAt)))s.timer.status='idle';if(s.timer.status==='running'&&Math.max(0,Number(s.timer.durationMs||0)-(now()-Number(s.timer.startedAt)))<=0){s.timer.status='expired';s.timer.pausedRemainingMs=0;}s.paused=!!s.paused;return s;}

function buildRoundShow(){resetScores();const cfg=ensureRSConfig(state.config.roundshow);if(cfg.rounds.length<2||cfg.rounds.length>8){toast('Bitte 2 bis 8 Runden zusammenstellen');return;}const kinds=cfg.rounds.map(r=>r.kind);if(new Set(kinds).size!==kinds.length){toast('Jeder Rundentyp darf im Moment nur einmal vorkommen');return;}const used=new Set(),runtime=[];for(const r of cfg.rounds){const challenges=rsSelectChallenges(r,used);if(!challenges){toast(`Für „${RS3_TYPES[r.kind].short}“ sind nicht genug passende Aufgaben vorhanden`);return;}challenges.forEach(q=>used.add(q.id));runtime.push({...clone(r),label:RS3_TYPES[r.kind].label,challenges});}state.status='ready';state.game={type:'roundshow',roundIndex:0,itemIndex:0,rounds:runtime,phase:'rules',practice:false,pending:{},quick:{attempts:0,selectedTeam:null,attemptedTeamIds:[]},wagers:{},estimates:{},clueIndex:0,clueTeam:null,clueAttemptedTeamIds:[],answerRevealed:false,tieIndex:0};state.screen='rules';resetTimer(runtime[0].timer);persist();render();}
function currentChallenge(){if(!state?.game)return null;if(state.game.type==='roundshow'){if(state.game.practice)return PRACTICE.roundshow;const round=state.game.rounds[state.game.roundIndex];return round?.challenges?.[state.game.itemIndex]||null;}if(state.game.type==='classic'){if(state.game.practice)return PRACTICE.classic;if(state.game.currentTileId)return classicQuestionById(state.game.currentTileId);return state.game.finalChallenge||null;}return null;}

function nextRoundShow(){const g=state.game,r=g.rounds[g.roundIndex];if(g.itemIndex<r.challenges.length-1){setState(s=>{s.game.itemIndex++;s.game.pending={};s.game.estimates={};s.game.quick={attempts:0,selectedTeam:null,attemptedTeamIds:[]};s.game.clueIndex=0;s.game.clueTeam=null;s.game.clueAttemptedTeamIds=[];s.game.answerRevealed=false;const mode=RS3_TYPES[s.game.rounds[s.game.roundIndex].kind].mode;s.game.phase=mode==='final'?'wagers':mode==='clue'?'clue':'question';resetTimer(s.game.rounds[s.game.roundIndex].timer);},{undo:true});return;}if(g.roundIndex<g.rounds.length-1){setState(s=>{s.game.roundIndex++;s.game.itemIndex=0;s.game.pending={};s.game.estimates={};s.game.quick={attempts:0,selectedTeam:null,attemptedTeamIds:[]};s.game.clueIndex=0;s.game.clueTeam=null;s.game.clueAttemptedTeamIds=[];s.game.answerRevealed=false;s.screen='between';s.game.phase='between';resetTimer(s.game.rounds[s.game.roundIndex].timer);},{undo:true});}else finishGame();}
function applySimultaneous(){const ch=currentChallenge(),mode=rsRoundMode();if(!ch)return;if(mode==='estimate'){applyEstimation();return;}pushUndo();const pts=rsCurrentPoints();for(const t of state.teams){if(state.game.pending[t.id]==='correct'){t.score+=pts;state.scoreHistory.push({teamId:t.id,delta:pts,source:'correct',challengeId:ch.id,timestamp:now()});}}state.game.phase='resolved';state.game.answerRevealed=true;persist();render();sound('correct');}
function applyEstimation(){const ch=currentChallenge(),vals=state.game.estimates||{},valid=state.teams.map(t=>({t,v:Number(vals[t.id])})).filter(x=>Number.isFinite(x.v));if(valid.length!==state.teams.length){toast('Bitte für jedes Team eine Schätzung eintragen');return;}valid.sort((a,b)=>Math.abs(a.v-ch.numericAnswer)-Math.abs(b.v-ch.numericAnswer));pushUndo();const p=rsCurrentPoints(),bestDist=Math.abs(valid[0].v-ch.numericAnswer),first=valid.filter(x=>Math.abs(x.v-ch.numericAnswer)===bestDist);first.forEach(x=>{x.t.score+=p;state.scoreHistory.push({teamId:x.t.id,delta:p,source:'correct',challengeId:ch.id,timestamp:now()});});const rest=valid.filter(x=>!first.includes(x));if(rest.length){const second=Math.max(25,Math.round(p*.6/25)*25),secondDist=Math.abs(rest[0].v-ch.numericAnswer);rest.filter(x=>Math.abs(x.v-ch.numericAnswer)===secondDist).forEach(x=>{x.t.score+=second;state.scoreHistory.push({teamId:x.t.id,delta:second,source:'correct',challengeId:ch.id,timestamp:now()});});}state.game.phase='resolved';state.game.answerRevealed=true;persist();render();sound('correct');}
function quickResult(correct){const ch=currentChallenge(),id=state.game.quick.selectedTeam;if(!id)return;pushUndo();const t=getTeam(id),p=rsCurrentPoints(),penalty=Math.max(25,Math.round(p/2/25)*25);if(!t)return;if(correct){t.score+=p;state.scoreHistory.push({teamId:id,delta:p,source:'correct',challengeId:ch.id,timestamp:now()});state.game.phase='resolved';state.game.answerRevealed=true;}else{t.score-=penalty;state.scoreHistory.push({teamId:id,delta:-penalty,source:'incorrect',challengeId:ch.id,timestamp:now()});state.game.quick.attemptedTeamIds=state.game.quick.attemptedTeamIds||[];if(!state.game.quick.attemptedTeamIds.includes(id))state.game.quick.attemptedTeamIds.push(id);state.game.quick.attempts++;if(state.game.quick.attempts>=2){state.game.phase='resolved';state.game.answerRevealed=true;}else{state.game.quick.selectedTeam=null;state.game.phase='question';resetTimer(roundTimer());}}persist();render();sound(correct?'correct':'wrong');}

function ensureConnectionsConfig(c){const d={preset:'standard',profile:'ligo',links:5,walls:1,sequences:4,clueTimer:20,wallTimer:240,sequenceTimer:20};mergeDefaults(c,d);c.links=Math.max(3,Math.min(8,Number(c.links)||5));c.walls=Math.max(1,Math.min(2,Number(c.walls)||1));c.sequences=Math.max(3,Math.min(6,Number(c.sequences)||4));if(!['short','standard','long','custom'].includes(c.preset))c.preset='standard';if(!['ligo','general','bible'].includes(c.profile))c.profile='ligo';return c;}
function connSetPreset(name){setState(s=>{const c=ensureConnectionsConfig(s.config.connections);c.preset=name;if(name==='short'){c.links=3;c.walls=1;c.sequences=3;}if(name==='standard'){c.links=5;c.walls=1;c.sequences=4;}if(name==='long'){c.links=6;c.walls=2;c.sequences=5;}});}
function connDuration(c){c=ensureConnectionsConfig(c);const sec=c.links*(c.clueTimer*2.3+55)+c.walls*(c.wallTimer+210)+c.sequences*(c.sequenceTimer*2+50)+240;const mid=sec/60;return {lo:Math.max(15,Math.round(mid-5)),hi:Math.round(mid+6)};}
function connShuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function connPick(pool,profile,count){if(profile==='general'||profile==='bible')return connShuffle(pool.filter(x=>x.profile===profile)).slice(0,count);const g=connShuffle(pool.filter(x=>x.profile==='general')),b=connShuffle(pool.filter(x=>x.profile==='bible')),out=[];let gi=0,bi=0;for(let i=0;i<count;i++){const wantBible=i%3===2;if(wantBible&&bi<b.length)out.push(b[bi++]);else if(gi<g.length)out.push(g[gi++]);else if(bi<b.length)out.push(b[bi++]);}return out;}

ihres Bereichs.</div></div><div class="conn-config-card"><div class="summary-label">ZEITEN</div><div class="conn-timer-grid"><label>Zeit je neuem Hinweis<select data-change="connTimer" data-key="clueTimer">${[15,20,25,30].map(v=>`<option value="${v}" ${c.clueTimer===v?'selected':''}>${v} Sek.</option>`).join('')}</select></label><label>Verbindungswand<select data-change="connTimer" data-key="wallTimer">${[120,180,240,300].map(v=>`<option value="${v}" ${c.wallTimer===v?'selected':''}>${Math.round(v/60)} Min.</option>`).join('')}</select></label><label>Zeit je Folgenschritt<select data-change="connTimer" data-key="sequenceTimer">${[15,20,25,30].map(v=>`<option value="${v}" ${c.sequenceTimer===v?'selected':''}>${v} Sek.</option>`).join('')}</select></label></div></div></div><aside class="panel-light"><div class="summary-label">HEUTE</div><div class="summary-value">Verbindungen · ${CONN_PROFILE_LABELS[c.profile]}</div><div class="summary-item"><div class="summary-label">Geschätzte Dauer</div><div class="summary-value">~${dur.lo}–${dur.hi} Min.</div></div><div class="summary-item"><div class="summary-label">Ablauf</div><div class="conn-flow"><span>1. ${c.links} × Vier Hinweise</span><span>2. ${c.walls} × Verbindungswand</span><span>3. ${c.sequences} × Folge finden</span></div></div><div class="summary-item"><div class="summary-label">Punkte</div><div class="config-note">Vier Hinweise: 4→1 · Folge: 3→1 · Wand: 2 Punkte je richtige Gruppe und 2 je richtige Verbindung.</div></div></aside></div><div class="wizard-actions"><button class="btn" data-action="backGame">← ZURÜCK</button><button class="btn primary big" data-action="launch">BEREIT →</button></div>`;}
function renderGameConfig(){if(state.selectedGame==='roundshow')return renderRSConfig();if(state.selectedGame==='classic')return renderCBConfig();return renderConnectionsConfig();}
function buildConnections(){resetScores();const c=ensureConnectionsConfig(state.config.connections);const links=connPick(CONN_LINKS,c.profile,c.links),walls=connPick(CONN_WALLS,c.profile,c.walls),sequences=connPick(CONN_SEQUENCES,c.profile,c.sequences);if(links.length<c.links||walls.length<c.walls||sequences.length<c.sequences){toast('Für diese Auswahl sind nicht genug Aufgaben vorhanden');return;}state.status='ready';state.game={type:'connections',roundIndex:0,itemIndex:0,rounds:[{kind:'links',challenges:links},{kind:'wall',challenges:walls},{kind:'sequence',challenges:sequences}],phase:'rules',practice:false,clueIndex:0,locks:{},evaluations:{},wallRevealCount:0,wallScores:{},answerRevealed:false,tieIndex:0};state.screen='rules';resetTimer(c.clueTimer);persist();render();}
function launchSelected(){if(state.selectedGame==='roundshow')buildRoundShow();else if(state.selectedGame==='classic')buildClassic();else buildConnections();}
function connRound(){return state?.game?.type==='connections'?state.game.rounds[state.game.roundIndex]:null;}
function currentChallenge(){if(!state?.game)return null;if(state.game.type==='connections'){if(state.game.practice)return {...CONN_PRACTICE,type:'connection',prompt:'Was verbindet diese vier Hinweise?',category:'PROBERUNDE',durationSec:20};return connRound()?.challenges?.[state.game.itemIndex]||null;}if(state.game.type==='roundshow'){if(state.game.practice)return PRACTICE.roundshow;const round=state.game.rounds[state.game.roundIndex];return round?.challenges?.[state.game.itemIndex]||null;}if(state.game.type==='classic'){if(state.game.practice)return PRACTICE.classic;if(state.game.currentTileId)return classicQuestionById(state.game.currentTileId);return state.game.finalChallenge||null;}return null;}
function connMaxPoints(){const k=connRound()?.kind;return k==='links'?4:k==='sequence'?3:0;}
function connAvailablePoints(){return Math.max(1,connMaxPoints()-(state.game.clueIndex||0));}
function connRoundTimer(){const c=ensureConnectionsConfig(state.config.connections),k=connRound()?.kind;return k==='wall'?c.wallTimer:k==='sequence'?c.sequenceTimer:c.clueTimer;}
function connResetItem(s){const g=s.game,k=g.rounds[g.roundIndex].kind;g.clueIndex=0;g.locks={};g.evaluations={};g.wallRevealCount=0;g.wallScores={};g.answerRevealed=false;g.phase=k==='wall'?'wallSolve':k==='sequence'?'sequenceClues':'linkClues';for(const t of s.teams)g.wallScores[t.id]={groups:0,links:0};resetTimer(k==='wall'?s.config.connections.wallTimer:k==='sequence'?s.config.connections.sequenceTimer:s.config.connections.clueTimer);}
function startCurrentRound(){if(state.game.type==='connections'){setState(s=>{s.screen='playing';s.status='playing';connResetItem(s);});return;}if(state.game.type==='roundshow'){setState(s=>{const r=s.game.rounds[s.game.roundIndex],mode=RS3_TYPES[r.kind].mode;s.screen='playing';s.status='playing';s.game.phase=mode==='final'?'wagers':mode==='clue'?'clue':'question';s.game.pending={};s.game.estimates={};s.game.quick={attempts:0,selectedTeam:null,attemptedTeamIds:[]};s.game.clueIndex=0;s.game.clueTeam=null;s.game.clueAttemptedTeamIds=[];s.game.answerRevealed=false;resetTimer(r.timer);});}else{setState(s=>{s.screen='playing';s.status='playing';s.game.stage='board';s.game.answerRevealed=false;resetTimer(s.config.classic.mainTimer);});}}
function connLockTeam(id){const g=state.game;if(!['linkClues','sequenceClues'].includes(g.phase)||g.locks[id])return;setState(s=>{s.game.locks[id]={clue:(s.game.clueIndex||0)+1,points:Math.max(1,connMaxPoints()-(s.game.clueIndex||0))};},{undo:true});sound('reveal');}
function connNextClue(){const g=state.game,ch=currentChallenge(),max=(connRound().kind==='links'?ch.clues.length:ch.items.length);if((g.clueIndex||0)<max-1){setState(s=>{s.game.clueIndex++;resetTimer(connRoundTimer());},{undo:true});return;}connStartEvaluation();}
function connStartEvaluation(){setState(s=>{s.game.phase='evaluate';s.game.answerRevealed=true;s.game.evaluations={};s.timer.status='paused';s.timer.pausedRemainingMs=currentTimerRemaining();},{undo:true});sound('reveal');}
function connEval(id,val){setState(s=>{s.game.evaluations[id]=val;});}
function connApplyEvaluation(){const g=state.game,locked=Object.keys(g.locks||{});if(!locked.every(id=>['correct','wrong'].includes(g.evaluations?.[id]))){toast('Bitte jede festgelegte Antwort als richtig oder falsch markieren');return;}pushUndo();for(const id of locked){if(g.evaluations[id]==='correct'){const t=getTeam(id),p=g.locks[id].points;t.score+=p;state.scoreHistory.push({teamId:id,delta:p,source:'connection',challengeId:currentChallenge()?.id,timestamp:now()});}}g.phase='resolved';g.answerRevealed=true;persist();render();sound('correct');}
function connStartWallReveal(){setState(s=>{s.game.phase='wallReveal';s.game.wallRevealCount=1;s.timer.status='paused';s.timer.pausedRemainingMs=currentTimerRemaining();},{undo:true});sound('reveal');}
function connRevealWall(){const g=state.game;if(g.wallRevealCount<4){setState(s=>s.game.wallRevealCount++);sound('reveal');return;}setState(s=>s.game.phase='wallScore');}
function connApplyWall(){const g=state.game,ch=currentChallenge();for(const t of state.teams){const v=g.wallScores?.[t.id]||{};if(Number(v.links)>Number(v.groups)){toast(`Bei ${t.name} können nicht mehr Verbindungen als richtige Gruppen zählen`);return;}}pushUndo();for(const t of state.teams){const v=g.wallScores[t.id]||{},delta=2*(Number(v.groups)||0)+2*(Number(v.links)||0);if(delta){t.score+=delta;state.scoreHistory.push({teamId:t.id,delta,source:'connection-wall',challengeId:ch.id,timestamp:now()});}}g.phase='resolved';g.answerRevealed=true;g.wallRevealCount=4;persist();render();sound('correct');}
function nextConnections(){const g=state.game,r=connRound();if(g.itemIndex<r.challenges.length-1){setState(s=>{s.game.itemIndex++;connResetItem(s);},{undo:true});return;}if(g.roundIndex<g.rounds.length-1){setState(s=>{s.game.roundIndex++;s.game.itemIndex=0;s.game.phase='between';s.screen='between';s.game.answerRevealed=false;resetTimer(connRoundTimer());},{undo:true});return;}finishGame();}
function connWallScoreInputs(){const g=state.game;return `<div class="conn-wall-score">${state.teams.map(t=>{const v=g.wallScores?.[t.id]||{groups:0,links:0};return `<label class="wager-row"><span class="stripe" style="height:38px;background:${teamColor(t)}"></span><b>${esc(t.name)}</b><select aria-label="Richtige Gruppen von ${esc(t.name)}" data-change="connWallGroups" data-id="${t.id}">${[0,1,2,3,4].map(x=>`<option value="${x}" ${Number(v.groups)===x?'selected':''}>${x} Gruppen</option>`).join('')}</select><select aria-label="Richtige Verbindungen von ${esc(t.name)}" data-change="connWallLinks" data-id="${t.id}">${[0,1,2,3,4].map(x=>`<option value="${x}" ${Number(v.links)===x?'selected':''}>${x} Verbindungen</option>`).join('')}</select></label>`}).join('')}</div>`;}
function connHostClues(ch){const visible=connRound().kind==='links'?ch.clues.slice(0,(state.game.clueIndex||0)+1):ch.items.slice(0,(state.game.clueIndex||0)+1);return `<div class="host-label">${connRound().kind==='links'?'HINWEISE':'FOLGE'}</div><div class="host-clues">${visible.map((x,i)=>`<div class="connection-clue"><b>${String(i+1).padStart(2,'0')}</b> ${esc(x)}</div>`).join('')}</div><div class="answer-box ${state.game.answerRevealed?'answer-revealed':''}"><div class="host-label">LÖSUNG ${state.game.answerRevealed?'· AM BEAMER SICHTBAR':'· NUR SPIELLEITUNG'}</div><div class="answer">${esc(ch.answer)}</div>${ch.note?`<div class="host-note">${esc(ch.note)}</div>`:''}</div>`;}
function connLockControls(){const g=state.game,p=connAvailablePoints();return `<div class="host-label">ANTWORT FESTLEGEN · AKTUELL ${p} P.</div><div class="conn-lock-list">${state.teams.map(t=>{const l=g.locks?.[t.id],ev=g.evaluations?.[t.id];return `<div class="conn-lock ${l?'locked':''} ${ev==='correct'?'good':ev==='wrong'?'bad':''}"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div>${l?`<div class="conn-lock-status">FESTGELEGT BEI HINWEIS ${l.clue} · <span class="conn-lock-points">${l.points} P.</span></div>`:`<button class="btn" style="width:100%" data-action="connLock" data-id="${t.id}">JETZT FESTLEGEN · ${p} P.</button>`}</div>`}).join('')}</div>`;}
function connEvalControls(){const g=state.game;return `<div class="host-label">FESTGELEGTE ANTWORTEN AUSWERTEN</div><div class="conn-lock-list">${state.teams.map(t=>{const l=g.locks?.[t.id],ev=g.evaluations?.[t.id];if(!l)return `<div class="conn-lock"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div><div class="conn-lock-status">KEINE ANTWORT · 0 P.</div></div>`;return `<div class="conn-lock ${ev==='correct'?'good':ev==='wrong'?'bad':''}"><div class="team-head"><div class="stripe" style="background:${teamColor(t)}"></div><div class="team-name">${esc(t.name)}</div><div class="team-score">${t.score}</div></div><div class="team-actions"><button class="btn success" data-action="connEval" data-id="${t.id}" data-value="correct">RICHTIG +${l.points}</button><button class="btn wrong" data-action="connEval" data-id="${t.id}" data-value="wrong">FALSCH · 0</button></div></div>`}).join('')}</div>`;}
function hostConnections(){const g=state.game,r=connRound(),ch=currentChallenge(),kind=r.kind,total=r.challenges.length;let left=`<div class="host-col"><div class="conn-round-badge">RUNDE ${g.roundIndex+1} / ${g.rounds.length}</div><h2 class="host-title">${CONN_ROUNDS[kind].label}</h2><div class="progress-text">Aufgabe ${g.itemIndex+1} / ${total}</div>${g.phase!=='evaluate'&&g.phase!=='resolved'&&g.phase!=='wallScore'&&g.phase!=='wallReveal'?timerHost():''}<div class="host-message">${kind==='links'?'Teams können ihre Lösung jederzeit festlegen. Früher = mehr Punkte.':kind==='wall'?'Findet vier Gruppen zu je vier Begriffen und die jeweilige Verbindung.':'Was kommt als Nächstes? Teams können früh festlegen und mehr Punkte riskieren.'}</div></div>`;
let mid=`<div class="host-col">`,right=`<div class="host-col">`;
if(kind==='wall'){
 mid+=`<div class="host-label">VERBINDUNGSWAND</div><div class="question-host">${g.phase==='wallSolve'?'Teams lösen die Wand auf Papier oder Tafel. Noch nichts auflösen.':g.phase==='wallReveal'?'Löse die Gruppen nacheinander auf.':'Alle Gruppen sind sichtbar.'}</div>${connWallHostPreview(ch)}</div>`;
 if(g.phase==='wallSolve')right+=hostTeams()+`<button class="btn primary" style="width:100%" data-action="connWallRevealStart">ZEIT VORBEI · AUFLÖSUNG STARTEN →</button>`;
 else if(g.phase==='wallReveal')right+=`<div class="host-message">Sichtbar: ${g.wallRevealCount} / 4 Gruppen</div><button class="btn primary" style="width:100%" data-action="connWallReveal">${g.wallRevealCount<4?'NÄCHSTE GRUPPE AUFLÖSEN':'PUNKTE EINTRAGEN →'}</button>`;
 else if(g.phase==='wallScore')right+=connWallScoreInputs()+`<div class="conn-score-explain">2 Punkte je richtige Vierergruppe + 2 Punkte je korrekt benannte Verbindung. Maximal 16 Punkte pro Wand.</div><button class="btn primary" style="width:100%;margin-top:10px" data-action="connWallApply">PUNKTE VERGEBEN</button>`;
 else right+=hostTeams()+`<button class="btn primary" style="width:100%" data-action="nextConn">${connNextLabel()}</button>`;
}else{
 mid+=connHostClues(ch)+`</div>`;
 if(g.phase==='linkClues'||g.phase==='sequenceClues'){right+=connLockControls()+`<button class="btn primary" style="width:100%;margin-top:10px" data-action="connNextClue">${(g.clueIndex||0)<(kind==='links'?ch.clues.length-1:ch.items.length-1)?'NÄCHSTEN HINWEIS ZEIGEN':'ZUR AUSWERTUNG →'}</button><button class="btn" style="width:100%;margin-top:7px" data-action="connEvaluate">JETZT AUSWERTEN</button>`;}
 else if(g.phase==='evaluate')right+=connEvalControls()+`<button class="btn primary" style="width:100%;margin-top:10px" data-action="connApplyEval">PUNKTE VERGEBEN</button>`;
 else right+=hostTeams()+`<button class="btn primary" style="width:100%" data-action="nextConn">${connNextLabel()}</button>`;
}
right+=scoreHistory()+`</div>`;return left+mid+right;}
function connNextLabel(){const g=state.game,r=connRound();if(g.itemIndex<r.challenges.length-1)return 'NÄCHSTE AUFGABE →';if(g.roundIndex<g.rounds.length-1)return 'RUNDE BEENDEN →';return 'ERGEBNIS ZEIGEN →';}
function connWallHostPreview(ch){return `<div class="host-message compact-hint">${ch.items.join(' · ')}</div>${state.game.wallRevealCount?ch.groups.slice(0,state.game.wallRevealCount).map((g,i)=>`<div class="host-message"><b>GRUPPE ${i+1}: ${esc(g.label)}</b><br>${g.items.map(esc).join(' · ')}</div>`).join(''):''}`;}
function connDisplayClues(ch){const kind=connRound().kind,max=kind==='links'?ch.clues.length:ch.items.length,visible=(state.game.clueIndex||0)+1,arr=kind==='links'?ch.clues:ch.items;if(kind==='sequence'){return `<div class="conn-sequence">${[0,1,2].map(i=>`<div class="conn-seq-item ${i<visible?'':'hidden'}">${i<visible?esc(arr[i]):'?'}</div>`).join('')}<div class="conn-seq-item hidden">?</div></div>`;}return `<div class="conn-clue-grid">${arr.map((x,i)=>`<div class="conn-clue ${i<visible?'':'hidden'}"><span class="idx">${String(i+1).padStart(2,'0')}</span>${i<visible?esc(x):''}</div>`).join('')}</div>`;}
function connLockRail(){return `<div class="conn-lock-rail">${state.teams.map(t=>`<div class="conn-lock-chip ${state.game.locks?.[t.id]?'on':''}">${esc(t.name)} · ${state.game.locks?.[t.id]?'FESTGELEGT':'OFFEN'}</div>`).join('')}</div>`;}
function connWallDisplay(ch){const reveal=state.game.wallRevealCount||0,map={};ch.groups.forEach((g,gi)=>g.items.forEach(x=>map[x]=gi));return `<div class="conn-wall-grid">${ch.items.map(x=>{const gi=map[x],on=gi<reveal;return `<div class="conn-wall-item ${on?'g'+gi:''}">${esc(x)}</div>`}).join('')}</div>${reveal?`<div class="conn-wall-legend">${ch.groups.slice(0,reveal).map((g,i)=>`<div class="conn-wall-group"><b>GRUPPE ${i+1} · ${esc(g.label)}</b><span>${g.items.map(esc).join(' · ')}</span></div>`).join('')}</div>`:''}`;}
function renderDisplayConnections(){const g=state.game,r=connRound(),ch=currentChallenge(),top=`VERBINDUNGEN · RUNDE ${g.roundIndex+1} / ${g.rounds.length} · ${CONN_ROUNDS[r.kind].label}`;if(r.kind==='wall'){let status=g.phase==='wallSolve'?`${g.itemIndex+1} / ${r.challenges.length} · 4 GRUPPEN FINDEN`:g.phase==='wallReveal'?`AUFLÖSUNG · ${g.wallRevealCount} / 4`:'PUNKTE';app(displayShell(`<div class="display-kicker">VERBINDUNGSWAND</div><h1 class="display-question q-sm">Vier Gruppen zu je vier Begriffen – und was verbindet sie?</h1>${connWallDisplay(ch)}`,top,status,g.phase==='wallSolve'));return;}const max=connMaxPoints(),visible=(g.clueIndex||0)+1,status=g.phase==='resolved'||g.phase==='evaluate'?'LÖSUNG':`${r.kind==='links'?'HINWEIS':'SCHRITT'} ${visible} · ${connAvailablePoints()} PUNKTE`;app(displayShell(`<div class="display-kicker">${CONN_ROUNDS[r.kind].label}</div><h1 class="display-question q-sm">${r.kind==='links'?'Was verbindet diese Hinweise?':'Was kommt als Nächstes?'}</h1>${connDisplayClues(ch)}${connLockRail()}${g.answerRevealed?`<div class="display-answer">${esc(ch.answer)}</div>`:''}`,top,status,['linkClues','sequenceClues'].includes(g.phase)));}
function hostMainContent(){if(state.paused)return `<div class="host-col"><h2 class="host-title">Spiel pausiert</h2>${timerHost()}</div><div class="host-col"><div class="question-host">Die Beameransicht ist pausiert. Fortsetzen, sobald der Raum bereit ist.</div></div><div class="host-col">${hostTeams()}${scoreHistory()}</div>`;if(state.screen==='rules')return hostRules();if(state.screen==='practice')return hostPractice();if(state.screen==='roundIntro')return hostRoundIntro();if(state.screen==='between')return hostBetween();if(state.screen==='results')return hostResults();if(state.screen==='tiebreaker')return hostTiebreaker();if(state.screen==='playing'){if(state.game.type==='roundshow')return hostRoundShow();if(state.game.type==='classic')return hostClassic();return hostConnections();}return '';}
function renderDisplay(){if(!state){app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">WARTE AUF DIE SPIELLEITUNG</h1><p class="display-sub">Diese Ansicht wird über die Spielleitung geöffnet.</p></main></div>`);return;}if(state.paused){app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">PAUSE</h1><p class="display-sub">Das Spiel geht gleich weiter.</p></main>${scoreRail()}</div>`);return;}if(state.screen==='rules'){renderDisplayRules();return;}if(state.screen==='practice'){renderDisplayPractice();return;}if(state.screen==='roundIntro'){renderDisplayRoundIntro();return;}if(state.screen==='between'){renderDisplayBetween();return;}if(state.screen==='results'){renderDisplayResults();return;}if(state.screen==='tiebreaker'){renderDisplayTiebreaker();return;}if(state.screen==='playing'){if(state.game.type==='roundshow')renderDisplayRS();else if(state.game.type==='classic')renderDisplayClassic();else renderDisplayConnections();return;}app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">GLEICH GEHT’S LOS</h1></main>${scoreRail()}</div>`);}
function hostRules(){const name=state.game.type==='roundshow'?'Rundenquiz':state.game.type==='classic'?'Quiztafel':'Verbindungen';let extra='';if(state.game.type==='roundshow')extra=`${state.game.rounds.length} Runden wurden zusammengestellt.`;if(state.game.type==='connections')extra='Drei Denk-Runden: Vier Hinweise, Verbindungswand und Folge finden.';return `<div class="host-col"><div class="host-label">BEREIT</div><h2 class="host-title">${name}</h2><div class="host-message">${extra} Öffne die Beameransicht, erkläre die Kurzregeln und starte bei Bedarf zuerst die Proberunde ohne Punkte.</div></div><div class="host-col"><h2 class="host-title">Regelübersicht</h2><div class="question-host">Auf dem Beamer stehen gerade die Kurzregeln für ${name}.</div><button class="btn" data-action="practice">PROBERUNDE</button> <button class="btn primary" data-action="startRules">SPIEL STARTEN →</button></div><div class="host-col">${hostTeams()}${state.game.type==='roundshow'?`<div class="host-message compact-hint">${state.game.rounds.map((r,i)=>`${i+1}. ${RS3_TYPES[r.kind].short}`).join('<br>')}</div>`:state.game.type==='connections'?`<div class="host-message compact-hint">1. Vier Hinweise<br>2. Verbindungswand<br>3. Folge finden</div>`:''}</div>`;}
function renderDisplayRules(){const type=state.game.type;let title,rules;if(type==='roundshow'){title='RUNDENQUIZ';const n=state.game.rounds.length;rules=[['01',`${n} VERSCHIEDENE RUNDEN`],['02','BERATET EUCH IM TEAM'],['03','JEDE RUNDE HAT EIGENE REGELN'],['04','ALLE PUNKTE ZÄHLEN ZUSAMMEN']];}else if(type==='classic'){title='QUIZTAFEL';const c=state.config.classic;rules=[['01','KATEGORIE UND PUNKTWERT WÄHLEN'],['02',c.selectorRule==='correct'?'RICHTIGE ANTWORT? IHR WÄHLT WEITER':'DAS WAHLRECHT ROTIERT FEST'],['03',c.stealMode==='none'?'FALSCHE ANTWORT? DANN WIRD AUFGELÖST':c.stealMode==='relay'?'FALSCH? MEHRERE TEAMS KÖNNEN KLAUEN':'FALSCH? EIN TEAM DARF KLAUEN'],['04','VERSTECKTE SONDERFELDER KÖNNEN ALLES ÄNDERN']];}else{title='VERBINDUNGEN';rules=[['01','ALLE TEAMS DENKEN GLEICHZEITIG'],['02','FRÜH FESTLEGEN = MEHR PUNKTE'],['03','BEI DER WAND: GRUPPEN + VERBINDUNG FINDEN'],['04','KEINE ELIMINATION · ALLE BLEIBEN DABEI']];}app(`<div class="display"><button class="btn small fullscreen-hint" data-action="fullscreen">VOLLBILD</button><div class="display-top"><div>LIGO / QUIZABEND</div><div>SO FUNKTIONIERT’S</div></div><main class="display-main"><div class="display-kicker">${title}</div><h1 class="display-title" style="font-size:92px">SO FUNKTIONIERT’S</h1><div class="rules-grid">${rules.map(([n,t])=>`<div class="rule-item"><div class="rule-num">${n}</div><div class="rule-text">${t}</div></div>`).join('')}</div></main>${scoreRail()}</div>`);}
function hostPractice(){if(state.game.type!=='connections'){const ch=currentChallenge();return `<div class="host-col"><div class="host-label">PROBERUNDE</div><h2 class="host-title">Keine Punkte</h2>${timerHost()}</div><div class="host-col"><div class="host-label">FRAGE</div><div class="question-host">${esc(ch.prompt)}</div><div class="answer-box ${state.game?.answerRevealed?'answer-revealed':''}"><div class="host-label">ANTWORT ${state.game?.answerRevealed?'· AM BEAMER SICHTBAR':'· NUR SPIELLEITUNG'}</div><div class="answer">${esc(ch.answer)}</div></div><button class="btn" data-action="reveal">ANTWORT ZEIGEN</button></div><div class="host-col">${hostTeams()}<button class="btn primary" style="width:100%;margin-top:10px" data-action="endPractice">PROBERUNDE BEENDEN →</button></div>`;}const ch=currentChallenge();return `<div class="host-col"><div class="host-label">PROBERUNDE</div><h2 class="host-title">Vier Hinweise · keine Punkte</h2></div><div class="host-col">${connHostPractice(ch)}<button class="btn" data-action="reveal">LÖSUNG ZEIGEN</button></div><div class="host-col"><div class="host-message">Erkläre: Im echten Spiel werden Hinweise nacheinander gezeigt. Ein Team kann früh festlegen und erhält dann mehr Punkte, kann seine Antwort aber nicht mehr ändern.</div>${hostTeams()}<button class="btn primary" style="width:100%;margin-top:10px" data-action="endPractice">PROBERUNDE BEENDEN →</button></div>`;}

const LOGIC_PRACTICE={id:'lg-practice',level:1,kind:'sequence',prompt:'1 · 3 · 5 · ?',answer:'7',explanation:'Die Zahlen steigen jeweils um 2.'};
function logicDefaultConfig(){return {preset:'standard',perLevel:3,timeProfile:'standard',joker:true};}
function ensureLogicConfig(c){const d=logicDefaultConfig();c=mergeDefaults(c||{},d);if(!['short','standard','long','custom'].includes(c.preset))c.preset='standard';if(!['quick','standard','relaxed'].includes(c.timeProfile))c.timeProfile='standard';c.perLevel=Math.max(1,Math.min(5,Number(c.perLevel)||3));c.joker=c.joker!==false;return c;}
function logicSetPreset(name){setState(s=>{const c=ensureLogicConfig(s.config.logic);c.preset=name;if(name==='short')c.perLevel=2;if(name==='standard')c.perLevel=3;if(name==='long')c.perLevel=4;});}
function logicTimes(){return LOGIC_TIME_PROFILES[ensureLogicConfig(state.config.logic).timeProfile]||LOGIC_TIME_PROFILES.standard;}
function logicDuration(c){c=ensureLogicConfig(c);const times=LOGIC_TIME_PROFILES[c.timeProfile]||LOGIC_TIME_PROFILES.standard;const puzzleSec=c.perLevel*times.reduce((a,b)=>a+b,0)+c.perLevel*5*38+5*55+150;const mid=puzzleSec/60;return {lo:Math.max(15,Math.round(mid-5)),hi:Math.round(mid+7)};}
function logicShuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function logicBuildLevels(count){return LOGIC_LEVELS.map(l=>({level:l.n,label:l.label,points:l.points,challenges:logicShuffle(LOGIC_PUZZLES.filter(q=>q.level===l.n)).slice(0,count)}));}
function logicLevel(){return state?.game?.type==='logic'?state.game.levels[state.game.levelIndex]:null;}
function logicChallenge(){if(state?.game?.type!=='logic')return null;if(state.game.practice)return LOGIC_PRACTICE;return logicLevel()?.challenges?.[state.game.itemIndex]||null;}
function logicTimerForLevel(idx=state?.game?.levelIndex||0){const c=ensureLogicConfig(state.config.logic);return (LOGIC_TIME_PROFILES[c.timeProfile]||LOGIC_TIME_PROFILES.standard)[idx]||45;}
function logicLevelProgress(){const g=state.game,l=logicLevel();return l?`${g.itemIndex+1} / ${l.challenges.length}`:'';}
function renderLogicConfig(){const c=ensureLogicConfig(state.config.logic),dur=logicDuration(c),times=LOGIC_TIME_PROFILES[c.timeProfile];return `${wizardHeader('04 / 04','Logikleiter','Kein Fachwissen nötig: Alle Teams lösen gleichzeitig zunehmend schwierigere Denkaufgaben.')}<div class="logic-config-layout"><div class="logic-config-stack"><div class="logic-config-card"><div class="summary-label">SPIELUMFANG</div><div class="choice-row logic-preset-row"><button class="choice ${c.preset==='short'?'active':''}" data-action="logicPreset" data-value="short">KURZ</button><button class="choice ${c.preset==='standard'?'active':''}" data-action="logicPreset" data-value="standard">STANDARD</button><button class="choice ${c.preset==='long'?'active':''}" data-action="logicPreset" data-value="long">LANG</button><button class="choice ${c.preset==='custom'?'active':''}" disabled>EIGEN</button></div><div class="logic-custom-grid"><label>Aufgaben pro Stufe<select data-change="logicCount">${[1,2,3,4,5].map(v=>`<option value="${v}" ${c.perLevel===v?'selected':''}>${v} pro Stufe · ${v*5} gesamt</option>`).join('')}</select></label><label>Gesamtstufen<select disabled><option>5 Stufen</option></select></label></div></div><div class="logic-config-card"><div class="summary-label">DENKZEIT</div><div class="choice-row logic-time-row">${[['quick','KNAPP'],['standard','STANDARD'],['relaxed','RUHIG']].map(([v,l])=>`<button class="choice ${c.timeProfile===v?'active':''}" data-action="logicTime" data-value="${v}">${l}</button>`).join('')}</div><div class="config-note">Stufe 1 bis 5: ${times.map(x=>x+' Sek.').join(' · ')}</div></div><div class="logic-config-card"><div class="summary-label">STRATEGIE</div><div class="logic-joker-box"><div><b>RISIKO-JOKER</b><span>Einmal pro Team im ganzen Spiel. Richtig: doppelte Punkte. Falsch: der normale Punktwert wird abgezogen.</span></div><button class="choice ${c.joker?'active':''}" data-action="logicJoker">${c.joker?'AN':'AUS'}</button></div><div class="logic-no-knowledge">Die Aufgaben verlangen keine speziellen Bibel-, Popkultur- oder Fachkenntnisse. Papier oder Team-Whiteboards sind hilfreich, aber nicht erforderlich.</div></div></div><aside class="panel-light"><div class="summary-label">HEUTE</div><div class="summary-value">Logikleiter · ${c.perLevel*5} Aufgaben</div><div class="summary-item"><div class="summary-label">Geschätzte Dauer</div><div class="summary-value">~${dur.lo}–${dur.hi} Min.</div></div><div class="summary-item"><div class="summary-label">Punkte je Stufe</div><div class="conn-flow">${LOGIC_LEVELS.map(l=>`<span>Stufe ${l.n} · ${l.label} · ${l.points} Pkt.</span>`).join('')}</div></div><div class="summary-item"><div class="summary-label">Risiko-Joker</div><div class="summary-value">${c.joker?'1 × pro Team':'Aus'}</div></div></aside></div><div class="wizard-actions"><button class="btn" data-action="backGame">← ZURÜCK</button><button class="btn primary big" data-action="launch">BEREIT →</button></div>`;}
function buildLogic(){resetScores();const c=ensureLogicConfig(state.config.logic),levels=logicBuildLevels(c.perLevel);if(levels.some(l=>l.challenges.length<c.perLevel)){toast('Für eine Stufe sind nicht genug Logikaufgaben vorhanden');return;}state.status='ready';state.game={type:'logic',levelIndex:0,itemIndex:0,levels,phase:'rules',practice:false,pending:{},boosted:{},boostUsed:Object.fromEntries(state.teams.map(t=>[t.id,false])),answerRevealed:false,tieIndex:0};state.screen='rules';resetTimer(logicTimerForLevel(0));persist();render();}
function logicResetQuestion(s){const g=s.game;g.phase='question';g.pending={};g.boosted={};g.answerRevealed=false;resetTimer(logicTimerForLevel(g.levelIndex));}
function logicSetEval(id,val){setState(s=>{s.game.pending[id]=val==='correct';});}
function logicToggleJoker(id){const c=ensureLogicConfig(state.config.logic),g=state.game;if(!c.joker||g.boostUsed?.[id]){toast('Der Risiko-Joker dieses Teams ist nicht mehr verfügbar');return;}if(g.phase!=='question'){toast('Der Joker muss vor der Auswertung gesetzt werden');return;}setState(s=>{s.game.boosted[id]=!s.game.boosted[id];});}
function logicApply(){const g=state.game,l=logicLevel(),ch=logicChallenge();if(state.teams.some(t=>typeof g.pending[t.id]!=='boolean')){toast('Bitte jedes Team als richtig oder falsch markieren');return;}pushUndo();for(const t of state.teams){const correct=g.pending[t.id]===true,boost=!!g.boosted[t.id],base=l.points;let delta=correct?(boost?base*2:base):(boost?-base:0);if(boost)g.boostUsed[t.id]=true;if(delta){t.score+=delta;state.scoreHistory.push({teamId:t.id,delta,source:boost?'logic-joker':'logic',challengeId:ch.id,timestamp:now()});}}g.phase='resolved';g.answerRevealed=true;endTimer();persist();render();sound('correct');}
function nextLogic(){const g=state.game,l=logicLevel();if(g.itemIndex<l.challenges.length-1){setState(s=>{s.game.itemIndex++;logicResetQuestion(s);},{undo:true});return;}if(g.levelIndex<g.levels.length-1){setState(s=>{s.game.levelIndex++;s.game.itemIndex=0;s.game.phase='between';s.screen='between';s.game.pending={};s.game.boosted={};s.game.answerRevealed=false;resetTimer(logicTimerForLevel(s.game.levelIndex));},{undo:true});return;}finishGame();}
function logicLadderHTML(){if(state?.game?.type!=='logic')return '';const active=state.game.levelIndex;return `<div class="logic-ladder">${LOGIC_LEVELS.map((l,i)=>`<div class="logic-step ${i<active?'done':i===active?'active':''}"><span class="n">${l.n}</span><span class="label">${l.label}</span><span class="pts">${l.points}</span></div>`).join('')}</div>`;}
function logicPuzzleDisplay(ch,revealed=false){return `<div class="logic-display-wrap">${logicLadderHTML()}<div class="logic-puzzle"><div class="logic-kind">${esc(LOGIC_KIND_LABELS[ch.kind]||'DENKAUFGABE')}</div><div class="logic-prompt">${esc(ch.prompt)}</div>${revealed?`<div class="logic-answer">${esc(ch.answer)}</div><div class="logic-explain">${esc(ch.explanation||'')}</div>`:''}</div></div>`;}
function logicEvalPanel(){const g=state.game,c=ensureLogicConfig(state.config.logic),l=logicLevel();return `<div class="logic-eval-list">${state.teams.map(t=>{const status=g.pending[t.id],used=!!g.boostUsed[t.id],boost=!!g.boosted[t.id];return `<div class="logic-eval ${status===true?'good':status===false?'bad':''} ${boost?'boost':''}"><div class="team-head"><span class="stripe" style="background:${teamColor(t)}"></span><span class="team-name">${esc(t.name)}</span><span class="team-score">${t.score}</span></div><div class="logic-eval-actions"><button class="btn small ${status===true?'correct':''}" data-action="logicEval" data-id="${t.id}" data-value="correct">RICHTIG</button><button class="btn small ${status===false?'wrong':''}" data-action="logicEval" data-id="${t.id}" data-value="wrong">FALSCH</button></div>${c.joker?`<button class="btn small logic-joker-btn ${boost?'on':''}" data-action="logicJokerTeam" data-id="${t.id}" ${used?'disabled':''}>${used?'JOKER VERBRAUCHT':boost?`JOKER AKTIV · ±${l.points}`:'RISIKO-JOKER'}</button>`:''}</div>`}).join('')}</div>`;}
function hostLogic(){const g=state.game,l=logicLevel(),ch=logicChallenge(),idx=g.itemIndex+1;return `<div class="host-col"><div class="host-label">LOGIKLEITER · STUFE ${l.level} / 5</div><h2 class="host-title">${l.label}</h2><div class="host-message">Aufgabe ${idx} / ${l.challenges.length} · ${l.points} Punkte${ensureLogicConfig(state.config.logic).joker?' · Risiko-Joker möglich':''}</div>${timerHost()}<div class="logic-host-levels">${LOGIC_LEVELS.map((x,i)=>`<div class="logic-host-level ${i<g.levelIndex?'done':i===g.levelIndex?'active':''}"><span>${x.n}</span><span>${x.label}</span><span>${x.points}</span></div>`).join('')}</div></div><div class="host-col"><div class="host-label">${esc(LOGIC_KIND_LABELS[ch.kind]||'DENKAUFGABE')}</div><div class="question-host" style="white-space:pre-line">${esc(ch.prompt)}</div><div class="answer-box ${g.answerRevealed?'answer-revealed':''}"><div class="host-label">LÖSUNG ${g.answerRevealed?'· AM BEAMER SICHTBAR':'· NUR SPIELLEITUNG'}</div><div class="answer" style="white-space:pre-line">${esc(ch.answer)}</div>${ch.explanation?`<div class="host-message" style="margin-top:8px">${esc(ch.explanation)}</div>`:''}</div>${g.phase==='resolved'?'<button class="btn primary big" data-action="nextLogic">WEITER →</button>':''}</div><div class="host-col">${g.phase==='question'?`${logicEvalPanel()}<button class="btn primary" style="width:100%;margin-top:10px" data-action="logicApply">AUSWERTEN →</button>`:`<div class="host-message"><b>Ausgewertet.</b><br>Die Lösung und kurze Erklärung sind jetzt am Beamer sichtbar.</div>${hostTeams()}`}</div>`;}
function renderDisplayLogic(){const g=state.game,l=logicLevel(),ch=logicChallenge(),status=g.phase==='resolved'?'LÖSUNG':`${logicLevelProgress()} · ${l.points} PUNKTE`;app(displayShell(logicPuzzleDisplay(ch,g.answerRevealed),`LOGIKLEITER · STUFE ${l.level} / 5 · ${l.label}`,status,g.phase==='question'));}
function logicPracticeDisplay(){return `<div class="logic-display-wrap"><div class="logic-ladder">${LOGIC_LEVELS.map((l,i)=>`<div class="logic-step ${i===0?'active':''}"><span class="n">${l.n}</span><span class="label">${l.label}</span><span class="pts">${l.points}</span></div>`).join('')}</div><div class="logic-puzzle"><div class="logic-kind">PROBERUNDE · KEINE PUNKTE</div><div class="logic-prompt">${esc(LOGIC_PRACTICE.prompt)}</div>${state.game.answerRevealed?`<div class="logic-answer">${esc(LOGIC_PRACTICE.answer)}</div><div class="logic-explain">${esc(LOGIC_PRACTICE.explanation)}</div>`:''}</div></div>`;}

function newSessionTemplatePhase5(id){return {schemaVersion:SCHEMA,id,createdAt:now(),updatedAt:now(),status:'setup',screen:'teams',teams:[],equipment:{buzzers:false,whiteboards:false,paperPens:true},selectedGame:'roundshow',config:{roundshow:{preset:'standard',rounds:rsPreset('standard'),timers:{everybody:30,media:25,think:45,quickfire:15,final:60}},classic:{board:'standard',mainTimer:25,stealTimer:8,riskTiles:2,finalWager:true,profile:'ligo',pointScale:'classic',stealMode:'single',selectorRule:'rotation',finalMode:'wager',doubleTiles:1,allPlayTiles:1,customCats:5,customRows:5,selectedCategories:[]},connections:{preset:'standard',profile:'ligo',links:5,walls:1,sequences:4,clueTimer:20,wallTimer:240,sequenceTimer:20},logic:logicDefaultConfig()},game:null,timer:{status:'idle',durationMs:30000,baseDurationMs:30000,startedAt:null,pausedRemainingMs:null},paused:false,pauseTimerWasRunning:false,undoStack:[],scoreHistory:[]};}
function renderGameConfigPhase5(){if(state.selectedGame==='roundshow')return renderRSConfig();if(state.selectedGame==='classic')return renderCBConfig();if(state.selectedGame==='connections')return renderConnectionsConfig();return renderLogicConfig();}
function launchSelectedPhase5(){if(state.selectedGame==='roundshow')buildRoundShow();else if(state.selectedGame==='classic')buildClassic();else if(state.selectedGame==='connections')buildConnections();else buildLogic();}
function currentChallengePhase5(){if(!state?.game)return null;if(state.game.type==='logic')return logicChallenge();if(state.game.type==='connections'){if(state.game.practice)return {...CONN_PRACTICE,type:'connection',prompt:'Was verbindet diese vier Hinweise?',category:'PROBERUNDE',durationSec:20};return connRound()?.challenges?.[state.game.itemIndex]||null;}if(state.game.type==='roundshow'){if(state.game.practice)return PRACTICE.roundshow;const round=state.game.rounds[state.game.roundIndex];return round?.challenges?.[state.game.itemIndex]||null;}if(state.game.type==='classic'){if(state.game.practice)return PRACTICE.classic;if(state.game.currentTileId)return classicQuestionById(state.game.currentTileId);return state.game.finalChallenge||null;}return null;}
function startCurrentRoundPhase5(){if(state.game.type==='logic'){setState(s=>{s.screen='playing';s.status='playing';logicResetQuestion(s);});return;}if(state.game.type==='connections'){setState(s=>{s.screen='playing';s.status='playing';connResetItem(s);});return;}if(state.game.type==='roundshow'){setState(s=>{const r=s.game.rounds[s.game.roundIndex],mode=RS3_TYPES[r.kind].mode;s.screen='playing';s.status='playing';s.game.phase=mode==='final'?'wagers':mode==='clue'?'clue':'question';s.game.pending={};s.game.estimates={};s.game.quick={attempts:0,selectedTeam:null,attemptedTeamIds:[]};s.game.clueIndex=0;s.game.clueTeam=null;s.game.clueAttemptedTeamIds=[];s.game.answerRevealed=false;resetTimer(r.timer);});}else{setState(s=>{s.screen='playing';s.status='playing';s.game.stage='board';s.game.answerRevealed=false;resetTimer(s.config.classic.mainTimer);});}}
function hostMainContentPhase5(){if(state.paused)return `<div class="host-col"><h2 class="host-title">Spiel pausiert</h2>${timerHost()}</div><div class="host-col"><div class="question-host">Die Beameransicht ist pausiert. Fortsetzen, sobald der Raum bereit ist.</div></div><div class="host-col">${hostTeams()}${scoreHistory()}</div>`;if(state.screen==='rules')return hostRules();if(state.screen==='practice')return hostPractice();if(state.screen==='roundIntro')return hostRoundIntro();if(state.screen==='between')return hostBetween();if(state.screen==='results')return hostResults();if(state.screen==='tiebreaker')return hostTiebreaker();if(state.screen==='playing'){if(state.game.type==='roundshow')return hostRoundShow();if(state.game.type==='classic')return hostClassic();if(state.game.type==='connections')return hostConnections();return hostLogic();}return '';}
function renderDisplayPhase5(){if(!state){app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">WARTE AUF DIE SPIELLEITUNG</h1><p class="display-sub">Diese Ansicht wird über die Spielleitung geöffnet.</p></main></div>`);return;}if(state.paused){app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">PAUSE</h1><p class="display-sub">Das Spiel geht gleich weiter.</p></main>${scoreRail()}</div>`);return;}if(state.screen==='rules'){renderDisplayRules();return;}if(state.screen==='practice'){renderDisplayPractice();return;}if(state.screen==='roundIntro'){renderDisplayRoundIntro();return;}if(state.screen==='between'){renderDisplayBetween();return;}if(state.screen==='results'){renderDisplayResults();return;}if(state.screen==='tiebreaker'){renderDisplayTiebreaker();return;}if(state.screen==='playing'){if(state.game.type==='roundshow')renderDisplayRS();else if(state.game.type==='classic')renderDisplayClassic();else if(state.game.type==='connections')renderDisplayConnections();else renderDisplayLogic();return;}app(`<div class="display pause-screen"><main class="display-main"><div class="display-kicker">LIGO / QUIZABEND</div><h1 class="display-title">GLEICH GEHT’S LOS</h1></main>${scoreRail()}</div>`);}
function hostRulesPhase5(){const type=state.game.type,name=type==='roundshow'?'Rundenquiz':type==='classic'?'Quiztafel':type==='connections'?'Verbindungen':'Logikleiter';let extra='';if(type==='roundshow')extra=`${state.game.rounds.length} Runden wurden zusammengestellt.`;if(type==='connections')extra='Drei Denk-Runden: Vier Hinweise, Verbindungswand und Folge finden.';if(type==='logic')extra='Fünf Stufen werden zunehmend schwieriger. Alle Teams lösen jede Aufgabe gleichzeitig.';return `<div class="host-col"><div class="host-label">BEREIT</div><h2 class="host-title">${name}</h2><div class="host-message">${extra} Öffne die Beameransicht, erkläre die Kurzregeln und starte bei Bedarf zuerst die Proberunde ohne Punkte.</div></div><div class="host-col"><h2 class="host-title">Regelübersicht</h2><div class="question-host">Auf dem Beamer stehen gerade die Kurzregeln für ${name}.</div><button class="btn" data-action="practice">PROBERUNDE</button> <button class="btn primary" data-action="startRules">SPIEL STARTEN →</button></div><div class="host-col">${hostTeams()}${type==='roundshow'?`<div class="host-message compact-hint">${state.game.rounds.map((r,i)=>`${i+1}. ${RS3_TYPES[r.kind].short}`).join('<br>')}</div>`:type==='connections'?`<div class="host-message compact-hint">1. Vier Hinweise<br>2. Verbindungswand<br>3. Folge finden</div>`:type==='logic'?`<div class="host-message compact-hint">Stufe 1: 100 Punkte<br>Stufe 2: 200 Punkte<br>Stufe 3: 300 Punkte<br>Stufe 4: 400 Punkte<br>Stufe 5: 500 Punkte${ensureLogicConfig(state.config.logic).joker?'<br><br>Risiko-Joker: 1 × pro Team':''}</div>`:''}</div>`;}

EN</button></div><div class="host-col"><div class="host-message">Erkläre: Im echten Spiel werden Hinweise nacheinander gezeigt. Ein Team kann früh festlegen und erhält dann mehr Punkte, kann seine Antwort aber nicht mehr ändern.</div>${hostTeams()}<button class="btn primary" style="width:100%;margin-top:10px" data-action="endPractice">PROBERUNDE BEENDEN →</button></div>`;}
function renderDisplayRulesPhase5(){const type=state.game.type;let title,rules;if(type==='roundshow'){title='RUNDENQUIZ';const n=state.game.rounds.length;rules=[['01',`${n} VERSCHIEDENE RUNDEN`],['02','BERATET EUCH IM TEAM'],['03','JEDE RUNDE HAT EIGENE REGELN'],['04','ALLE PUNKTE ZÄHLEN ZUSAMMEN']];}else if(type==='classic'){title='QUIZTAFEL';const c=state.config.classic;rules=[['01','KATEGORIE UND PUNKTWERT WÄHLEN'],['02',c.selectorRule==='correct'?'RICHTIGE ANTWORT? IHR WÄHLT WEITER':'DAS WAHLRECHT ROTIERT FEST'],['03',c.stealMode==='none'?'FALSCHE ANTWORT? DANN WIRD AUFGELÖST':c.stealMode==='relay'?'FALSCH? MEHRERE TEAMS KÖNNEN KLAUEN':'FALSCH? EIN TEAM DARF KLAUEN'],['04','VERSTECKTE SONDERFELDER KÖNNEN ALLES ÄNDERN']];}else if(type==='connections'){title='VERBINDUNGEN';rules=[['01','ALLE TEAMS DENKEN GLEICHZEITIG'],['02','FRÜH FESTLEGEN = MEHR PUNKTE'],['03','BEI DER WAND: GRUPPEN + VERBINDUNG FINDEN'],['04','KEINE ELIMINATION · ALLE BLEIBEN DABEI']];}else{title='LOGIKLEITER';rules=[['01','ALLE TEAMS LÖSEN JEDE AUFGABE'],['02','KEIN SPEZIALWISSEN NÖTIG'],['03','JE HÖHER DIE STUFE, DESTO MEHR PUNKTE'],['04',ensureLogicConfig(state.config.logic).joker?'JEDES TEAM HAT EINEN RISIKO-JOKER':'KEINE ELIMINATION · ALLE BLEIBEN DABEI']];}app(`<div class="display"><button class="btn small fullscreen-hint" data-action="fullscreen">VOLLBILD</button><div class="display-top"><div>LIGO / QUIZABEND</div><div>SO FUNKTIONIERT’S</div></div><main class="display-main"><div class="display-kicker">${title}</div><h1 class="display-title" style="font-size:92px">SO FUNKTIONIERT’S</h1><div class="rules-grid">${rules.map(([n,t])=>`<div class="rule-item"><div class="rule-num">${n}</div><div class="rule-text">${t}</div></div>`).join('')}</div></main>${scoreRail()}</div>`);}

['logicApply','nextLogic'].forEach(x=>GUARDED_ACTIONS.add(x));
function handleActionPhase5(e){const a=e.currentTarget.dataset.action,id=e.currentTarget.dataset.id,v=e.currentTarget.dataset.value;if(a==='logicPreset'){if(GUARDED_ACTIONS.has(a)&&actionBlocked(a))return;logicSetPreset(v);return;}if(a==='logicTime'){setState(s=>{s.config.logic.timeProfile=v;});return;}if(a==='logicJoker'){setState(s=>{s.config.logic.joker=!ensureLogicConfig(s.config.logic).joker;});return;}if(a==='logicEval'){logicSetEval(id,v);return;}if(a==='logicJokerTeam'){logicToggleJoker(id);return;}if(a==='logicApply'){if(actionBlocked('logicApply'))return;logicApply();return;}if(a==='nextLogic'){if(actionBlocked('nextLogic'))return;nextLogic();return;}handleActionPhase4(e);}
function handleChangePhase5(e){const key=e.currentTarget.dataset.change,val=e.currentTarget.value;if(key==='logicCount'){setState(s=>{s.config.logic.perLevel=Number(val);s.config.logic.preset='custom';});return;}handleChangePhase4(e);}

const SURVEY_KIND={top:{label:'HÄUFIGSTE ANTWORT',short:'Häufigste Antwort',desc:'Trefft eine möglichst häufig genannte Antwort.'},three:{label:'NENNT DREI',short:'Nennt drei',desc:'Nennt drei verschiedene Antworten aus der Umfrage.'},rank:{label:'RANGFOLGE',short:'Rangfolge',desc:'Ordnet fünf Antworten nach ihrer Häufigkeit.'},higher:{label:'HÄUFIGER GENANNT',short:'Häufiger genannt',desc:'Welche von zwei Antworten wurde häufiger genannt?'},rare:{label:'SELTENE ANTWORT',short:'Seltene Antwort',desc:'Findet eine gültige, möglichst selten genannte Antwort.'}};
const SURVEY_ORDER=['top','three','rank','higher','rare'];const SURVEY_TIME_PROFILES={quick:{top:20,three:30,rank:35,higher:12,rare:20},standard:{top:30,three:45,rank:50,higher:18,rare:30},relaxed:{top:40,three:60,rank:70,higher:25,rare:40}};

function surveyDefaultConfig(){return {preset:'standard',profile:'ligo',timeProfile:'standard',counts:{top:3,three:2,rank:2,higher:4,rare:2}}}function ensureSurveyConfig(c){c=mergeDefaults(c||{},surveyDefaultConfig());for(const k of SURVEY_ORDER)c.counts[k]=Math.max(0,Math.min(4,Number(c.counts[k])||0));if(!['short','standard','long','custom'].includes(c.preset))c.preset='standard';if(!['ligo','general'].includes(c.profile))c.profile='ligo';if(!SURVEY_TIME_PROFILES[c.timeProfile])c.timeProfile='standard';return c}function surveyPreset(n){if(n==='short')return {top:2,three:1,rank:1,higher:3,rare:1};if(n==='long')return {top:4,three:3,rank:3,higher:4,rare:3};return {top:3,three:2,rank:2,higher:4,rare:2}}function surveySetPreset(n){setState(s=>{const c=ensureSurveyConfig(s.config.survey);c.preset=n;c.counts=surveyPreset(n)})}function surveyPool(p){if(p==='general')return SURVEY_GENERAL.slice();const o=[];let g=0,l=0;while(g<SURVEY_GENERAL.length||l<SURVEY_LIGO.length){if(g<SURVEY_GENERAL.length)o.push(SURVEY_GENERAL[g++]);if(g<SURVEY_GENERAL.length)o.push(SURVEY_GENERAL[g++]);if(l<SURVEY_LIGO.length)o.push(SURVEY_LIGO[l++])}return o}function surveyTotalTasks(c){return SURVEY_ORDER.reduce((n,k)=>n+Number(c.counts[k]||0),0)}function surveyActiveRounds(c){return SURVEY_ORDER.filter(k=>Number(c.counts[k]||0)>0).length}function surveyDuration(c){const t=SURVEY_TIME_PROFILES[c.timeProfile],s=SURVEY_ORDER.reduce((n,k)=>n+Number(c.counts[k]||0)*(t[k]+26),0)+(Math.max(0,surveyActiveRounds(c)-1)*55)+150,m=s/60;return {lo:Math.max(10,Math.round(m*.9)),hi:Math.max(15,Math.round(m*1.18))}}function surveyMakeTask(s,k,i){const x={id:`${s.id}-${k}-${i}`,kind:k,survey:s};if(k==='rank'){const a=s.answers.slice(0,5).map((z,j)=>({...z,rank:j})),q=(i%4)+1;x.rankItems=a.slice(q).concat(a.slice(0,q))}if(k==='higher'){const ps=[[0,2],[1,3],[0,3],[1,4]],p=ps[i%ps.length];x.pair=p.map(j=>s.answers[j])}return x}function surveyBuildRounds(c){const p=surveyPool(c.profile);if(surveyTotalTasks(c)>p.length)return null;let z=0;return SURVEY_ORDER.filter(k=>c.counts[k]>0).map(k=>{const a=[];for(let i=0;i<c.counts[k];i++)a.push(surveyMakeTask(p[z++],k,i));return {kind:k,label:SURVEY_KIND[k].label,challenges:a,timer:SURVEY_TIME_PROFILES[c.timeProfile][k]}})}function surveyRound(){return state.game.rounds[state.game.roundIndex]}function surveyTask(){return surveyRound()?.challenges?.[state.game.itemIndex]||null}function surveyResetQuestion(s){const r=s.game.rounds[s.game.roundIndex];s.game.phase='question';s.game.responses={};s.game.answerRevealed=false;resetTimer(r.timer)}function buildSurvey(){resetScores();const c=ensureSurveyConfig(state.config.survey);if(surveyTotalTasks(c)<3||surveyActiveRounds(c)<2){toast('Bitte mindestens 3 Aufgaben aus mindestens 2 Rundentypen wählen');return}const rounds=surveyBuildRounds(c);if(!rounds){toast('Für diese Auswahl sind nicht genug Umfragedaten vorhanden');return}state.status='ready';state.game={type:'survey',roundIndex:0,itemIndex:0,rounds,phase:'rules',practice:false,responses:{},answerRevealed:false,tieIndex:0};state.screen='rules';resetTimer(rounds[0].timer);persist();render()}
function surveyAnswerOptions(s,v=''){return `<option value="">— nicht in der Liste —</option>${s.answers.map((a,i)=>`<option value="${i}" ${String(v)===String(i)?'selected':''}>${esc(a.label)}</option>`).join('')}`}function surveyRarePoints(a){return Math.max(10,100-2*Number(a.count||0))}function surveyTopPoints(i){return i===0?100:i===1?60:i===2?30:0}function surveyResponsePreview(t,x){const r=state.game.responses?.[t.id];if(x.kind==='top')return `${r===''||r===undefined?0:surveyTopPoints(Number(r))} P.`;if(x.kind==='rare')return `${r===''||r===undefined?0:surveyRarePoints(x.survey.answers[Number(r)])} P.`;if(x.kind==='three'){const a=Array.isArray(r)?r:[],u=[...new Set(a.filter(v=>v!==''&&v!=null).map(Number))];return `${u.reduce((n,i)=>n+(x.survey.answers[i]?.count||0),0)} P.`}if(x.kind==='rank')return `${Math.max(0,Math.min(5,Number(r)||0))*20} P.`;if(x.kind==='higher'){if(!['a','b'].includes(r))return '0 P.';const c=x.pair[0].count>x.pair[1].count?'a':'b';return r===c?'100 P.':'0 P.'}return ''}
function surveyTeamInputs(x){return state.teams.map(t=>{const r=state.game.responses?.[t.id];let c='';if(x.kind==='top'||x.kind==='rare')c=`<select data-change="surveyOne" data-id="${t.id}">${surveyAnswerOptions(x.survey,r)}</select>`;else if(x.kind==='three'){const a=Array.isArray(r)?r:['','',''];c=`<div class="survey-entry-grid">${[0,1,2].map(q=>`<select data-change="surveyThree" data-id="${t.id}" data-slot="${q}">${surveyAnswerOptions(x.survey,a[q])}</select>`).join('')}</div>`}else if(x.kind==='rank')c=`<div class="survey-rank-input"><span>Exakt richtig platzierte Antworten</span><select data-change="surveyRank" data-id="${t.id}">${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${Number(r)===v?'selected':''}>${v} von 5</option>`).join('')}</select></div>`;else c=`<div class="survey-higher-actions"><button class="btn small ${r==='a'?'selected':''}" data-action="surveyHigher" data-id="${t.id}" data-value="a">A · ${esc(x.pair[0].label)}</button><button class="btn small ${r==='b'?'selected':''}" data-action="surveyHigher" data-id="${t.id}" data-value="b">B · ${esc(x.pair[1].label)}</button></div>`;return `<div class="survey-team-entry"><div class="team-head"><span class="stripe" style="background:${teamColor(t)}"></span><span class="team-name">${esc(t.name)}</span><span class="team-score">${t.score}</span></div>${c}<div class="survey-score-preview">AKTUELL · ${surveyResponsePreview(t,x)}</div></div>`}).join('')}
function surveyValidate(x){for(const t of state.teams){const r=state.game.responses?.[t.id];if(x.kind==='three'){const a=Array.isArray(r)?r:[],p=a.filter(v=>v!==''&&v!=null);if(p.length!==3){toast(`Bitte für ${t.name} drei Antworten zuordnen`);return false}if(new Set(p.map(String)).size!==3){toast(`Bei ${t.name} darf keine Antwort doppelt zählen`);return false}}else if(x.kind==='higher'){if(!['a','b'].includes(r)){toast(`Bitte für ${t.name} A oder B wählen`);return false}}else if(x.kind!=='rank'&&r===undefined){toast(`Bitte für ${t.name} eine Antwort zuordnen`);return false}}return true}
function surveyApply(){const g=state.game,x=surveyTask();if(!surveyValidate(x))return;pushUndo();for(const t of state.teams){const r=g.responses?.[t.id];let d=0;if(x.kind==='top')d=r===''?0:surveyTopPoints(Number(r));else if(x.kind==='three')d=[...new Set(r.map(Number))].reduce((n,i)=>n+(x.survey.answers[i]?.count||0),0);else if(x.kind==='rank')d=Math.max(0,Math.min(5,Number(r)||0))*20;else if(x.kind==='higher'){const c=x.pair[0].count>x.pair[1].count?'a':'b';d=r===c?100:0}else if(x.kind==='rare')d=r===''?0:surveyRarePoints(x.survey.answers[Number(r)]);if(d){t.score+=d;state.scoreHistory.push({teamId:t.id,delta:d,source:'survey',challengeId:x.id,timestamp:now()})}}g.phase='resolved';g.answerRevealed=true;endTimer();persist();render();sound('correct')}
function nextSurvey(){const g=state.game,r=surveyRound();pushUndo();if(g.itemIndex<r.challenges.length-1){g.itemIndex++;surveyResetQuestion(state);persist();render();return}if(g.roundIndex<g.rounds.length-1){g.roundIndex++;g.itemIndex=0;g.phase='between';g.responses={};g.answerRevealed=false;state.screen='between';resetTimer(surveyRound().timer);persist();render();sound('round');return}state.status='results';state.screen='results';g.phase='results';endTimer();persist();render();sound('winner')}
function surveyBars(s,n=8){return `<div class="survey-bars">${s.answers.slice(0,n).map((a,i)=>`<div class="survey-bar"><div class="survey-bar-rank">${i+1}</div><div class="survey-bar-track"><div class="survey-bar-fill" style="width:${a.count}%"></div><div class="survey-bar-label">${esc(a.label)}</div></div><div class="survey-bar-count">${a.count}</div></div>`).join('')}</div>`}function surveyDisplayQuestion(x){const s=x.survey,R=state.game.answerRevealed;let b=`<div class="survey-display"><div class="survey-sample-badge">BEISPIELDATEN · 100 SPIELANTWORTEN</div><h1 class="survey-question">${esc(s.prompt)}</h1>`;if(!R){if(x.kind==='top')b+=`<div class="survey-prompt-hint">Schreibt <b>eine</b> Antwort auf. Platz 1 = 100 · Platz 2 = 60 · Platz 3 = 30 Punkte.</div>`;if(x.kind==='three')b+=`<div class="survey-prompt-hint">Schreibt <b>drei verschiedene</b> Antworten auf. Eure Punkte entsprechen zusammen deren Häufigkeit.</div>`;if(x.kind==='rank')b+=`<div class="survey-rank-cards">${x.rankItems.map(a=>`<div class="survey-rank-card">${esc(a.label)}</div>`).join('')}</div><div class="survey-prompt-hint">Ordnet diese fünf Antworten von <b>häufig</b> nach <b>selten</b>.</div>`;if(x.kind==='higher')b+=`<div class="survey-higher-grid"><div class="survey-higher-card"><div class="letter">A</div><div class="text">${esc(x.pair[0].label)}</div></div><div class="survey-vs">ODER</div><div class="survey-higher-card"><div class="letter">B</div><div class="text">${esc(x.pair[1].label)}</div></div></div><div class="survey-prompt-hint">Welche Antwort wurde häufiger genannt?</div>`;if(x.kind==='rare')b+=`<div class="survey-prompt-hint">Nennt <b>eine gültige, möglichst seltene</b> Antwort. Je seltener, desto mehr Punkte. Nicht in der Liste = 0.</div>`}else if(x.kind==='higher')b+=`<div class="survey-higher-grid"><div class="survey-higher-card"><div class="letter">A</div><div class="text">${esc(x.pair[0].label)}</div><div class="count">${x.pair[0].count}</div></div><div class="survey-vs">ZU</d const CONTENT_SCHEMA=1;
const CONTENT_KEY=PREFIX+'content.library.v1';
let CUSTOM_CLASSIC_CATS=[];
function contentDefaults(){return {schemaVersion:CONTENT_SCHEMA,packs:[{id:'mein-paket',name:'Meine Inhalte',active:true,createdAt:now()}],items:[]};}
function normalizeContentLibrary(x){const d=contentDefaults();if(!x||typeof x!=='object')return d;const o={schemaVersion:CONTENT_SCHEMA,packs:Array.isArray(x.packs)?x.packs:[],items:Array.isArray(x.items)?x.items:[]};o.packs=o.packs.filter(p=>p&&p.id&&p.name).map(p=>({id:String(p.id),name:String(p.name).slice(0,50),active:p.active!==false,createdAt:Number(p.createdAt)||now()}));if(!o.packs.length)o.packs=d.packs;o.items=o.items.filter(i=>i&&i.id&&i.type).map(i=>({...i,id:String(i.id),packId:String(i.packId||o.packs[0].id),createdAt:Number(i.createdAt)||now(),updatedAt:Number(i.updatedAt)||now()}));return o;}
function loadContentLibrary(){return normalizeContentLibrary(loadJSON(CONTENT_KEY,null));}
function saveContentLibrary(lib){const clean=normalizeContentLibrary(lib);if(!saveJSON(CONTENT_KEY,clean)){toast('Eigene Inhalte konnten nicht gespeichert werden');return false;}syncCustomContent(clean);return true;}
function enabledCustomItems(lib=loadContentLibrary()){const active=new Set(lib.packs.filter(p=>p.active).map(p=>p.id));return lib.items.filter(i=>active.has(i.packId));}
function removeCustomFrom(arr){for(let i=arr.length-1;i>=0;i--)if(arr[i]?._phase7custom)arr.splice(i,1);}
function syncCustomContent(lib=loadContentLibrary()){

function eventEstimate8(g){if(!g)return {lo:0,hi:0};try{const c=clone(g.config||{});if(g.type==='roundshow')return rsDuration(ensureRSConfig(c));if(g.type==='classic')return classicDuration(ensureClassicSelection(c));if(g.type==='connections')return connDuration(ensureConnectionsConfig(c));if(g.type==='logic')return logicDuration(ensureLogicConfig(c));if(g.type==='survey')return surveyDuration(ensureSurveyConfig(c));}catch{}return {lo:20,hi:60};}
