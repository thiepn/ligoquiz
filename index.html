function eventTotalEstimate8(){const ep=ensureEvent8(state),vals=ep.games.map(eventEstimate8);return {lo:vals.reduce((n,x)=>n+x.lo,0)+Math.max(0,ep.games.length-1)*2,hi:vals.reduce((n,x)=>n+x.hi,0)+Math.max(0,ep.games.length-1)*4};}

function eventOverallRanks8(){const ep=ensureEvent8(state),winner=ep.overallWinnerId;return state.teams.map(t=>({team:t,points:Number(ep.overall[t.id])||0})).sort((a,b)=>{const d=b.points-a.points;if(d)return d;if(winner){if(a.team.id===winner)return -1;if(b.team.id===winner)return 1;}return a.team.order-b.team.order;});}
function eventPoints8(){const n=state.teams.length,rows=ranks().map(t=>({id:t.id,score:t.score})),winner=state.game?.tiebreakWinnerId,out={};let i=0;while(i<rows.length){let j=i+1;while(j<rows.length&&rows[j].score===rows[i].score)j++;let group=rows.slice(i,j);if(winner&&group.some(x=>x.id===winner)&&group.length>1){out[winner]=n-i;const rest=group.filter(x=>x.id!==winner),start=i+1,end=j-1,avg=rest.length?Array.from({length:rest.length},(_,k)=>n-(start+k)).reduce((a,b)=>a+b,0)/rest.length:0;rest.forEach(x=>out[x.id]=avg);}else{const pts=Array.from({length:group.length},(_,k)=>n-(i+k)),avg=pts.reduce((a,b)=>a+b,0)/pts.length;group.forEach(x=>out[x.id]=avg);}i=j;}return out;}

function renderEventPlan8(){const ep=ensureEvent8(state);if(!ep.games.length)ep.games.push(makePlanGame8('roundshow'));const total=eventTotalEstimate8();return `${wizardHeader('03 / 03','Quizabend planen','Plane ein einzelnes großes Spiel oder mehrere kürzere Spiele. Teams und Ausstattung gelten für den ganzen Abend.')}<div class="event-plan-layout"><div><div class="event-plan-list">${ep.games.map((g,i)=>{const d=eventEstimate8(g),m=GAME8_META[g.type];return `<article class="event-plan-card"><div class="plan-num">${String(i+1).padStart(2,'0')}</div><div><select data-change="planGameType" data-id="${g.id}">${GAME8_TYPES.map(t=>`<option value="${t}" ${g.type===t?'selected':''}>${GAME8_META[t].label}</option>`).join('')}</select><div class="plan-meta">${esc(m.desc)}</div></div><div class="plan-detail"><div class="plan-title">${esc(eventGameSummary8(g))}</div><div class="plan-meta">~${d.lo}–${d.hi} Min. · Konfiguration wird für dieses Spiel separat gespeichert</div></div><div class="plan-actions"><button class="btn small" data-action="planMove" data-id="${g.id}" data-value="up" ${i===0?'disabled':''}>↑</button><button class="btn small" data-action="planMove" data-id="${g.id}" data-value="down" ${i===ep.games.length-1?'disabled':''}>↓</button><button class="btn small" data-action="planEdit" data-id="${g.id}">EINSTELLEN</button><button class="btn small" data-action="planRemove" data-id="${g.id}" ${ep.games.length===1?'disabled':''}>×</button></div></article>`}).join('')}</div><button class="btn event-add" data-action="planAdd" ${ep.games.length>=5?'disabled':''}>+ SPIEL HINZUFÜGEN</button><div class="event-config-note">Ein Spiel reicht völlig. Abendpunkte werden nur benötigt, wenn mehrere Spiele geplant sind; die Rohpunkte jedes Spiels bleiben separat gespeichert.</div></div><aside class="panel-light event-total"><div class="summary-label">HEUTE</div><div class="summary-value">${ep.games.length} ${ep.games.length===1?'Spiel':'Spiele'}</div><div class="summary-item"><div class="summary-label">Geschätzte Gesamtzeit</div><div class="summary-value">~${total.lo}–${total.hi} Min.</div></div><div class="summary-item"><div class="summary-label">Ablauf</div><div class="event-flow-list">${ep.games.map((g,i)=>{const d=eventEstimate8(g);return `<div class="event-flow-item"><span>${i+1}.</span><b>${GAME8_META[g.type].label}</b><span class="event-flow-time">~${d.lo}–${d.hi}</span></div>`}).join('')}</div></div><div class="summary-item"><div class="summary-label">Wertung</div><div class="config-note">${ep.games.length===1?'Das einzelne Spielergebnis entscheidet direkt.':`Nach jedem Spiel: ${state.teams.length} / ${state.teams.length-1} / … / 1 Abendpunkt nach Platzierung.`}</div></div></aside></div><div class="wizard-actions"><button class="btn" data-action="backEquipment">← ZURÜCK</button><button class="btn primary big" data-action="planStart">QUIZABEND BEREIT →</button></div>`;}

function completePlannedGame8(){const ep=ensureEvent8(state);if(!ep.started)return;const r=ranks(),topTie=r.length>1&&r[0].score===r[1].score&&!state.game?.tiebreakWinnerId;if(topTie){toast('Bitte zuerst den Gleichstand an der Spitze entscheiden');return;}const plan=eventGame8();if(ep.history.some(h=>h.planId===plan.id)){state.screen=ep.games.length===1?'eventResults':'eventTransition';persist();render();return;}const multi=ep.games.length>1,pts=multi?eventPoints8():Object.fromEntries(state.teams.map(t=>[t.id,0]));const rec={id:uid(),planId:plan.id,type:plan.type,title:GAME8_META[plan.type].label,completedAt:now(),scores:Object.fromEntries(state.teams.map(t=>[t.id,t.score])),ranking:r.map(t=>t.id),eventPoints:pts,winnerId:state.game?.tiebreakWinnerId||r[0]?.id};ep.history.push(rec);if(multi)for(const t of state.teams)ep.overall[t.id]=(Number(ep.overall[t.id])||0)+(Number(pts[t.id])||0);state.screen=ep.games.length===1?'eventResults':'eventTransition';state.status='ready';persist();render();sound('round');}

function showHostGuide15(start=0){document.querySelector('.guide15-backdrop')?.remove();let i=Math.max(0,Math.min(GUIDE15_STEPS.length-1,start));const d=document.createElement('div');d.className='modal-backdrop guide15-backdrop';document.body.appendChild(d);function draw(){const x=GUIDE15_STEPS[i];d.innerHTML=`<div class="modal guide15-modal"><div class="guide15-top"><div><div class="host-label">ERSTES MAL ALS SPIELLEITUNG?</div><h2>60-SEKUNDEN-EINFÜHRUNG</h2></div><button class="btn small" id="guide15Close">SCHLIESSEN</button></div><div class="guide15-progress">${GUIDE15_STEPS.map((_,n)=>`<span class="${n<i?'done':n===i?'now':''}">${String(n+1).padStart(2,'0')}</span>`).join('')}</div><section class="guide15-step"><div class="guide15-num">${x.k}</div><div><div class="guide15-kicker">${x.title}</div><h3>${x.head}</h3><p>${x.body}</p><div class="guide15-hint">${x.hint}</div></div></section><div class="guide15-cheat"><b>Der ganze Ablauf:</b><span>Teams</span><i>→</i><span>Spiel</span><i>→</i><span>Bereit</span><i>→</i><span>Regeln</span><i>→</i><span>Spielen</span></div><div class="modal-actions"><button class="btn" id="guide15Back" ${i===0?'disabled':''}>← ZURÜCK</button>${i<GUIDE15_STEPS.length-1?'<button class="btn primary" id="guide15Next">WEITER →</button>':`<button class="btn primary" id="guide15Done">${state?'VERSTANDEN · ZURÜCK ZUM SPIEL':'VERSTANDEN · QUIZABEND STARTEN →'}</button>`}</div></div>`;d.querySelector('#guide15Close').onclick=()=>d.remove();d.querySelector('#guide15Back').onclick=()=>{if(i>0){i--;draw();}};d.querySelector('#guide15Next')?.addEventListener('click',()=>{i++;draw();});d.querySelector('#guide15Done')?.addEventListener('click',()=>{setGuideSeen15();d.remove();if(!state)startNewNight();});}draw();}

function participantInstruction15(){if(!state)return '';if(state.screen==='rules')return 'ZUHÖREN · FRAGEN STELLEN · DANN GEHT’S LOS';if(state.screen==='practice')return 'PROBERUNDE · GEMEINSAM AUSPROBIEREN';if(state.screen==='roundIntro'||state.screen==='between'){const sp=typeof mechanicSpec14==='function'?mechanicSpec14():null;return sp?'KURZ ZUHÖREN · DIE NEUE MECHANIK WIRD ERKLÄRT':'KURZ ZUHÖREN · NÄCHSTE RUNDE';}if(state.screen!=='playing'||!state.game)return '';
 const g=state.game;
 if(g.type==='roundshow'){
   const kind=rsRoundMeta()?.kind,mode=rsRoundMode?.();
   if(g.phase==='resolved')return 'AUFLÖSUNG · KURZ ZUHÖREN';
   if(g.phase==='wagers')return 'IM TEAM BERATEN · EINSATZ GEHEIM FESTLEGEN';
   if(mode==='quick'||kind==='schnell')return 'BUZZERN / MELDEN, SOBALD IHR ES WISST';
   if(mode==='clue'||kind==='hinweise')return 'IM TEAM BERATEN · JEDERZEIT EINE LÖSUNG FESTLEGEN';
   if(kind==='ton')return 'ZUHÖREN · IM TEAM BERATEN · ANTWORT NOTIEREN';
   if(kind==='bild')return 'BILD ANSCHAUEN · IM TEAM BERATEN · ANTWORT NOTIEREN';
   if(kind==='reihenfolge')return 'IM TEAM BERATEN · REIHENFOLGE NOTIEREN';
   if(kind==='schaetzen')return 'IM TEAM BERATEN · EINE ZAHL FESTLEGEN';
   if(kind==='hoeher')return 'IM TEAM BERATEN · HÖHER ODER NIEDRIGER FESTLEGEN';
   return 'IM TEAM BERATEN · ANTWORT NOTIEREN';
 }
 if(g.type==='classic'){
   if(g.stage==='board')return `${state.teams[g.selectorIndex]?.name||'AKTIVES TEAM'} · FELD WÄHLEN`;
   if(g.stage==='riskChoice')return 'AKTIVES TEAM · SICHER ODER RISIKO ENTSCHEIDEN';
   if(g.stage==='allPlay')return 'ALLE TEAMS BERATEN · ANTWORT GEHEIM NOTIEREN';
   if(g.stage==='steal')return 'KLAUCHANCE · NUR DAS AUFGERUFENE TEAM ANTWORTET';
   if(g.stage==='finalWagers')return 'IM TEAM BERATEN · EINSATZ GEHEIM FESTLEGEN';
   if(g.stage==='finalQuestion')return 'IM TEAM BERATEN · ANTWORT GEHEIM NOTIEREN';
   if(g.stage==='resolved'||g.stage==='finalResolved')return 'AUFLÖSUNG · KURZ ZUHÖREN';
   return 'AKTIVES TEAM BERÄT · ANTWORT LAUT SAGEN';
 }
 if(g.type==='connections'){
   const k=connRound()?.kind;if(g.phase==='resolved'||g.phase==='evaluate'||g.phase==='wallReveal')return 'AUFLÖSUNG · KURZ ZUHÖREN';
   if(k==='wall')return 'IM TEAM BERATEN · 4 GRUPPEN FINDEN UND VERBINDUNG ERKLÄREN';
   if(k==='links')return 'IM TEAM BERATEN · JE FRÜHER FESTLEGEN, DESTO MEHR PUNKTE';
   return 'IM TEAM BERATEN · NÄCHSTEN SCHRITT FESTLEGEN';
 }
 if(g.type==='logic')return g.phase==='resolved'?'AUFLÖSUNG · KURZ ZUHÖREN':'IM TEAM KNOBELN · ANTWORT FESTLEGEN';
 if(g.type==='survey'){
   const k=surveyRound()?.kind;if(g.phase==='resolved')return 'AUFLÖSUNG · VERTEILUNG ANSCHAUEN';
   if(k==='top')return 'IM TEAM BERATEN · EINE MÖGLICHST HÄUFIGE ANTWORT NENNEN';
   if(k==='three')return 'IM TEAM BERATEN · DREI ANTWORTEN FESTLEGEN';
   if(k==='rank')return 'IM TEAM BERATEN · ANTWORTEN VON HÄUFIG NACH SELTEN SORTIEREN';
   if(k==='higher')return 'IM TEAM BERATEN · A ODER B FESTLEGEN';
   if(k==='rare')return 'IM TEAM BERATEN · EINE GÜLTIGE MÖGLICHST SELTENE ANTWORT FINDEN';
 }
 return '';
}

function currentHelp15(){if(!state)return {title:'Startseite',now:'Quizabend starten oder die kurze Einführung öffnen.',players:'Noch nichts – der Beamer muss erst nach dem Team-Setup geöffnet werden.',recover:'Kein Spielstand aktiv.'};

 if(s==='teams')return {title:'Teams',now:'3–5 Teams eintragen. Kurze, gut unterscheidbare Namen reichen.',players:'Noch nichts. Die Gruppe kann ihre Teamnamen gemeinsam festlegen.',recover:'Zur Startseite zurückgehen ändert noch keinen laufenden Abend.'};
 if(s==='gameSelect')return {title:'Spiel auswählen',now:'Nach dem gewünschten Gefühl im Raum wählen. Standardwerte sind bereits spielbar.',players:'Noch nichts. Du kannst die Auswahl kurz mit der Gruppe abstimmen.',recover:'Zurück zu Teams oder zum bereits geplanten Abend gehen.'};

 if(s==='ready11')return {title:'Bereit machen',now:'Beamer öffnen, Teams prüfen und benötigtes Material bereitlegen. Danach den Abend starten.',players:'Auf dem Beamer sehen sie bereits, welches Spiel gleich beginnt.',recover:'„Spiel ändern“ oder „Abend ändern“ ist weiterhin möglich.'};
 if(s==='rules')return {title:'Regeln erklären',now:'Die Kernregeln frei erklären. Danach direkt starten oder bei neuen Gruppen eine Proberunde nutzen.',players:'Sie sehen die kurzen Kernregeln und hören deiner Erklärung zu.',recover:'Bei Unklarheit kurz nachfragen lassen – kein Zeitdruck.'};
 if(s==='practice')return {title:'Proberunde',now:'Mechanik einmal ohne Leistungsdruck demonstrieren. Danach die Proberunde beenden.',players:'Sie probieren aus, wie Antworten abgegeben werden.',recover:'Proberunde hat keinen Einfluss auf den eigentlichen Spielstand.'};
 if(s==='roundIntro'||s==='between'){const sp=typeof mechanicSpec14==='function'?mechanicSpec14():null;return {title:sp?`Neue Mechanik: ${sp.title}`:'Nächste Runde',now:sp?'Die drei Punkte auf dem Beamer kurz in eigenen Worten erklären und STARTEN drücken.':'Nächste Runde ankündigen und starten.',players:sp?participantInstruction15():'Sie sehen den Rundenwechsel.',recover:'Diese Erklärung erscheint pro Mechanik nur beim ersten Auftreten.'};}
 if(s==='results')return {title:'Ergebnis',now:'Platzierungen kurz feiern. Bei mehreren Spielen anschließend das nächste Spiel starten oder den Abend beenden.',players:'Sie sehen Ergebnis, Platzierungen und gegebenenfalls Abendpunkte.',recover:'Fehler können weiterhin über Punkte korrigieren / Rückgängig behoben werden.'};
 if(s==='playing'&&g){let now='Frage laufen lassen. Danach AUFLÖSEN → WERTEN → WEITER.',extra='';
   if(g.type==='classic'&&g.stage==='board')now=`${state.teams[g.selectorIndex]?.name||'Das aktive Team'} wählt ein Feld. Anklicken, dann Frage moderieren.`;
   else if(g.type==='classic'&&g.stage==='steal')now='Klau-Team auswählen bzw. dessen Antwort anhören, dann richtig/falsch werten.';
   else if(g.type==='roundshow'&&rsRoundMode?.()==='quick')now='Erstes gültiges Signal auswählen, Antwort anhören und direkt richtig/falsch werten.';
   else if(g.type==='connections')now='Teams beraten lassen. Bei progressiven Hinweisen nur weiter aufdecken, wenn noch niemand festlegt.';
   else if(g.type==='logic')now='Teams knobeln lassen, Antworten markieren, dann WERTEN.';
   else if(g.type==='survey')now='Antworten der Teams erfassen, dann WERTEN und die Verteilung gemeinsam aufdecken.';
   return {title:'Laufendes Spiel',now,players:participantInstruction15()||'Sie beantworten die aktuelle Aufgabe.',recover:'Fehler? RÜCKGÄNGIG oder PUNKTE KORRIGIEREN. Im Zweifel fair entscheiden und weiterspielen.'};}
 return {title:'Spielleitung',now:'Dem hervorgehobenen nächsten Schritt folgen.',players:'Der Beamer zeigt nur die Informationen, die für die Gruppe relevant sind.',recover:'RÜCKGÄNGIG und PUNKTE KORRIGIEREN stehen jederzeit zur Verfügung.'};
}
